            </select>
          </label>
          <label class="row"><span>Sembunyikan status online</span><input type="checkbox" class="switch" id="priv-online"></label>
          <label class="row"><span>Sembunyikan centang biru</span><input type="checkbox" class="switch" id="priv-receipt"></label>
          <label class="row"><span>Mode Fokus (DND)</span><input type="checkbox" class="switch" id="priv-focus"></label>
        </div>

        <p class="section-title">Keamanan</p>
        <div class="card list-card">
          <button type="button" class="row" id="btn-blocked-list">
            <span><span class="row-ico">🚫</span>Daftar Diblokir</span><span class="chev">›</span>
          </button>
          <button type="button" class="row danger" id="btn-logout-2">
            <span><span class="row-ico">⏻</span>Keluar Akun</span><span class="chev">›</span>
          </button>
        </div>
      </div>
    </main>

    <button type="button" class="fab" id="fab" aria-label="Aksi baru">+</button>

    <nav class="bottom-nav">
      <button type="button" class="nav-btn active" data-tab="chats"><span class="ico">💬</span><span>Chat</span></button>
      <button type="button" class="nav-btn" data-tab="status"><span class="ico">◍</span><span>Status</span></button>
      <button type="button" class="nav-btn" data-tab="requests"><span class="ico">✉</span><span>Permintaan</span><em class="badge hidden" id="req-badge">0</em></button>
      <button type="button" class="nav-btn" data-tab="profile"><span class="ico">👤</span><span>Profil</span></button>
    </nav>
  </section>

  <!-- CHAT -->
  <section id="screen-chat" class="screen hidden">
    <header class="chat-topbar" id="chat-header" style="cursor:pointer;">
      <button type="button" class="icon-btn ghost-light" id="chat-back">←</button>
      <div class="avatar sm" id="chat-avatar" style="--a:#12b886;--b:#0a7c66">?</div>
      <div class="chat-topbar-info">
        <strong id="chat-name">—</strong>
        <small id="chat-sub">—</small>
      </div>
      <button type="button" class="icon-btn ghost-light" id="chat-menu">⋮</button>
    </header>
    <div class="chat-body" id="chat-body"></div>
    <div class="reply-bar hidden" id="reply-bar">
      <div class="reply-content">
        <strong id="reply-name">—</strong>
        <span id="reply-text">—</span>
      </div>
      <button type="button" class="icon-btn" id="reply-cancel">✕</button>
    </div>
    <form class="chat-input-bar" id="composer">
      <button type="button" class="soft-btn" id="btn-attach">＋</button>
      <div class="chat-input-wrap">
        <input id="chat-input" type="text" placeholder="Tulis pesan…" autocomplete="off">
      </div>
      <button type="button" class="soft-btn" id="btn-timer">⏱</button>
      <button type="submit" class="send-btn">➤</button>
    </form>
  </section>

  <div id="modal-root" class="hidden"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="photo-input" accept="image/*" class="hidden">
  <input type="file" id="chat-media-input" accept="image/*" class="hidden">
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "firebase/auth";
import {
  getFirestore, initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  collection, query, where, orderBy, limit, onSnapshot,
  serverTimestamp, arrayUnion, arrayRemove, getDocs, writeBatch, Timestamp
} from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyAt3cwXZtgkeiD0B3yJy1DOXKtlte1oiIM",
  authDomain: "chatgo-f4a66.firebaseapp.com",
  projectId: "chatgo-f4a66",
  storageBucket: "chatgo-f4a66.firebasestorage.app",
  messagingSenderId: "539633388986",
  appId: "1:539633388986:web:7517fa6642057a05a92183"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  experimentalForceLongPolling: true,
  useFetchStreams: false
});

const CLOUDINARY_CLOUD_NAME = "dyytjk3ho";
const CLOUDINARY_UPLOAD_PRESET = "chatgo_preset";

async function uploadToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  let response;
  try { response = await fetch(url, { method: "POST", body: formData }); } catch (e) { throw new Error("Koneksi gagal."); }
  if (!response.ok) { let m="Gagal"; try{ const d=await response.json(); m=d.error?.message||m; }catch{} throw new Error(m); }
  const data = await response.json();
  return data.secure_url;
}

const BLUE_TICK_SVG = `<svg class="tick-svg" viewBox="0 0 24 24"><path d="M12 2L14.5 5.5L18.5 4.5L19.5 8.5L23 11L20.5 14.5L21.5 18.5L17.5 19.5L15 23L11.5 20.5L7.5 21.5L6.5 17.5L3 15L5.5 11.5L4.5 7.5L8.5 6.5L11 3L12 2Z"/><path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;

const STATE = {
  uid: null, me: null,
  chats: [], requests: [], statuses: [],
  currentChat: null, replyTo: null, timerSec: 0,
  unsubChats: null, unsubMsgs: null, unsubRequests: null, unsubStatuses: null,
  isSelectMode: false, selectedChats: new Set()
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailFor = u => `${u.toLowerCase().trim()}@chatgo.local`;
const AVA_COLORS = [['#12b886','#0a7c66'],['#8b5cf6','#6d28d9'],['#f59e0b','#b45309'],['#ec4899','#be185d'],['#0ea5e9','#0369a1'],['#14b8a6','#0f766e']];
const colorFor = (str) => AVA_COLORS[(str || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % AVA_COLORS.length];
const initialsFor = (name) => (name || '?').trim().slice(0, 2).toUpperCase();
const fmtTime = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}).replace('.',':'); };
const fmtRel = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); const diff = Date.now() - d.getTime(); if (diff < 60000) return 'baru saja'; if (diff < 3600000) return Math.floor(diff/60000) + 'm lalu'; if (diff < 86400000) return Math.floor(diff/3600000) + 'j lalu'; return d.toLocaleDateString('id-ID', {day:'numeric', month:'short'}); };

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function showScreen(id) {
  $$('.screen').forEach(s => {
    const on = s.id === id;
    s.classList.toggle('active', on);
    s.classList.toggle('hidden', !on);
  });
}

function avatarHTML(name, photo, cls = '', id = '') {
  const [a, b] = colorFor(name || '?');
  const classes = 'avatar' + (cls ? ' ' + cls : '');
  const idAttr = id ? ` id="${esc(id)}"` : '';
  if (photo) return `<div class="${classes}"${idAttr}><img src="${esc(photo)}" alt=""></div>`;
  return `<div class="${classes}"${idAttr} style="--a:${a};--b:${b}">${esc(initialsFor(name))}</div>`;
}

function setAvatarEl(el, name, photo, extraCls = '') {
  if (!el) return;
  el.className = 'avatar' + (extraCls ? ' ' + extraCls : '');
  const [a, b] = colorFor(name || '?');
  el.style.setProperty('--a', a); el.style.setProperty('--b', b);
  if (photo) el.innerHTML = `<img src="${esc(photo)}" alt="">`;
  else el.innerHTML = esc(initialsFor(name));
}

function showModal(html, onMount) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal">${html}</div></div>`;
  root.classList.remove('hidden');
  root.querySelector('.modal-backdrop').addEventListener('click', e => {
    if (e.target.classList.contains('modal-backdrop')) closeModal();
  });
  if (onMount) onMount(root);
}
function closeModal() { const root = $('#modal-root'); root.innerHTML = ''; root.classList.add('hidden'); }

/* AUTH */
async function registerUser(displayName, username, password) {
  const uname = username.toLowerCase().trim();
  if (!/^[a-z0-9_]{3,20}$/.test(uname)) throw new Error('Username harus 3-20 karakter');
  if (password.length < 6) throw new Error('Password minimal 6 karakter');
  if (!displayName.trim()) throw new Error('Nama tampilan wajib');
  const unameSnap = await getDoc(doc(db, 'usernames', uname));
  if (unameSnap.exists()) throw new Error('Username sudah dipakai');
  const cred = await createUserWithEmailAndPassword(auth, emailFor(uname), password);
  const uid = cred.user.uid;
  await setDoc(doc(db, 'usernames', uname), { uid, createdAt: serverTimestamp() });
  await setDoc(doc(db, 'users', uid), {
    displayName: displayName.trim(), username: uname, bio: '', photoURL: '',
    privacy: { whoCanMessage: 'everyone', hideOnline: false, hideReceipt: false, focus: false },
    blocked: [], hiddenChats: [], isVerified: false, isBanned: false, createdAt: serverTimestamp()
  });
  await addDoc(collection(db, 'chats'), {
    type: 'self', name: 'Catatan Pribadi', members: [uid],
    lastMessage: { text: 'Pesan tersimpan', senderId: uid, senderName: displayName },
    updatedAt: serverTimestamp(), createdAt: serverTimestamp()
  });
}

async function loginUser(username, password) {
  return signInWithEmailAndPassword(auth, emailFor(username.toLowerCase().trim()), password);
}

async function loadProfileAndShow(user) {
  let snap = null;
  for (let i = 0; i < 10; i++) {
    snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) break;
    await new Promise(r => setTimeout(r, 500));
  }
  if (!snap || !snap.exists()) { showModal(`<div class="modal-body"><p class="muted small">Gagal memuat profil. Logout & coba lagi.</p></div><div class="modal-footer"><button class="btn btn-soft" onclick="location.reload()">Tutup</button></div>`); return; }
  if (snap.data().isBanned) {
    showModal(`<div class="modal-header"><h3>Akses Ditolak 🚫</h3></div><div class="modal-body"><p class="muted small">Akun Anda diblokir.</p></div><div class="modal-footer"><button class="btn btn-soft" id="banned-logout">Keluar</button></div>`, root => { root.querySelector('#banned-logout').onclick = () => { closeModal(); signOut(auth); }; });
    return;
  }
  STATE.uid = user.uid;
  STATE.me = { uid: user.uid, ...snap.data() };
  updateProfileUI();
  showScreen('screen-home');
  attachListeners();
}

onAuthStateChanged(auth, async user => {
  detachListeners();
  if (!user) { STATE.uid = null; STATE.me = null; showScreen('screen-auth'); return; }
  STATE.uid = user.uid;
  await loadProfileAndShow(user);
});

function updateProfileUI() {
  const me = STATE.me; if (!me) return;
  const tick = me.isVerified ? BLUE_TICK_SVG : '';
  if ($('#topbar-name')) $('#topbar-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-name')) $('#me-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-username')) $('#me-username').textContent = '@' + me.username;
  if ($('#me-bio')) $('#me-bio').textContent = me.bio || 'Belum ada bio';
  if ($('#me-alias')) $('#me-alias').textContent = '@' + me.username;
  setAvatarEl($('#my-status-avatar'), me.displayName, me.photoURL);
  setAvatarEl($('#me-avatar'), me.displayName, me.photoURL, 'lg');
  const p = me.privacy || {};
  if($('#priv-who')) $('#priv-who').value = p.whoCanMessage || 'everyone';
  if($('#priv-online')) $('#priv-online').checked = !!p.hideOnline;
  if($('#priv-receipt')) $('#priv-receipt').checked = !!p.hideReceipt;
  if($('#priv-focus')) $('#priv-focus').checked = !!p.focus;
}

function detachListeners() {
  ['unsubChats','unsubRequests','unsubStatuses','unsubMsgs'].forEach(k => {
    if (STATE[k]) { try { STATE[k](); } catch(e){} STATE[k] = null; }
  });
}
function attachListeners() { detachListeners(); listenChats(); listenRequests(); listenStatuses(); }

/* --- CHAT LIST & HIDE FEATURE --- */
function listenChats() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', STATE.uid));
  STATE.unsubChats = onSnapshot(q, snap => {
    const all = [];
    const hidden = STATE.me.hiddenChats || [];
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (!c.isBanned && !(c.pendingFor || []).includes(STATE.uid) && !hidden.includes(c.id)) {
        all.push(c);
      }
    });
    STATE.chats = all;
    STATE.chats.sort((a, b) => {
      if (a.type === 'self') return -1;
      if (b.type === 'self') return 1;
      return (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0);
    });
    renderChats();
  });
}

$('#btn-select-mode').addEventListener('click', () => {
  STATE.isSelectMode = !STATE.isSelectMode;
  STATE.selectedChats.clear();
  $('#search-container').classList.toggle('hidden', STATE.isSelectMode);
  $('#select-container').classList.toggle('hidden', !STATE.isSelectMode);
  $('.bottom-nav').classList.toggle('hidden', STATE.isSelectMode);
  $('#fab').classList.toggle('hidden', STATE.isSelectMode);
  $('#btn-select-mode').classList.toggle('ghost-light', !STATE.isSelectMode);
  $('#btn-select-mode').classList.toggle('active', STATE.isSelectMode);
  $('#list-chats').classList.toggle('select-mode-active', STATE.isSelectMode);
  renderChats();
});

$('#btn-cancel-select').addEventListener('click', () => $('#btn-select-mode').click());

$('#btn-select-all').addEventListener('click', () => {
  if (STATE.selectedChats.size === STATE.chats.length) {
    STATE.selectedChats.clear();
  } else {
    STATE.chats.forEach(c => STATE.selectedChats.add(c.id));
  }
  renderChats();
});

$('#btn-hide-selected').addEventListener('click', async () => {
  if (STATE.selectedChats.size === 0) { toast('Pilih chat dulu'); return; }
  if (!confirm(`Sembunyikan ${STATE.selectedChats.size} chat?`)) return;
  try {
    const arr = Array.from(STATE.selectedChats);
    await updateDoc(doc(db, 'users', STATE.uid), { hiddenChats: arrayUnion(...arr) });
    STATE.me.hiddenChats = [...(STATE.me.hiddenChats || []), ...arr];
    toast('Chat disembunyikan');
    $('#btn-select-mode').click();
    listenChats();
  } catch (e) { toast('Gagal: ' + e.message); }
});

function chatDisplayName(chat) {
  if (chat.type === 'self') return 'Catatan Pribadi';
  if (chat.type === 'group') return chat.name || 'Grup';
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberNames?.[otherUid] || chat.name || 'Chat';
}
function getChatTick(chat) {
  if (chat.type === 'group' && chat.isVerified) return BLUE_TICK_SVG;
  if (chat.type === 'direct') {
    const otherUid = (chat.members || []).find(u => u !== STATE.uid);
    if (chat.memberVerified && chat.memberVerified[otherUid]) return BLUE_TICK_SVG;
  }
  return '';
}
function chatDisplayPhoto(chat) {
  if (chat.type === 'self') return null;
  if (chat.type === 'group') return chat.photoURL || null;
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberPhotos?.[otherUid] || null;
}

function renderChats() {
  const list = $('#list-chats');
  const filter = ($('#search-input').value || '').toLowerCase().trim();
  const items = STATE.chats.filter(c => {
    if (!filter) return true;
    return chatDisplayName(c).toLowerCase().includes(filter) || (c.name || '').toLowerCase().includes(filter);
  });

  if (!items.length) {
    list.innerHTML = `<div class="empty">Belum ada chat.<br>Ketuk <b>+</b> untuk mulai chat baru.</div>`;
    return;
  }
  list.innerHTML = items.map(chat => {
    const name = chatDisplayName(chat);
    const photo = chatDisplayPhoto(chat);
    const tick = getChatTick(chat);
    const last = chat.lastMessage;
    const preview = last ? (last.senderId === STATE.uid ? 'Kamu: ' : '') + (last.text || '📎 Media') : 'Belum ada pesan';
    const time = last?.createdAt ? fmtTime(last.createdAt) : (chat.updatedAt ? fmtTime(chat.updatedAt) : '');
    const unread = (chat.unread || {})[STATE.uid] || 0;
    const icons = [chat.type === 'self' ? '📝' : '', chat.type === 'group' ? '👥' : ''].filter(Boolean).map(i => `<span class="tag">${i}</span>`).join('');
    const isSelected = STATE.selectedChats.has(chat.id) ? 'selected' : '';

    return `<div class="chat-item ${isSelected}" data-chat="${chat.id}">
      <div class="chat-checkbox"></div>
      ${avatarHTML(name, photo)}
      <div class="chat-item-body">
        <div class="chat-top">
          <div class="chat-name">${icons}<span class="truncate">${esc(name)}</span> ${tick}</div>
          <span class="chat-time">${esc(time)}</span>
        </div>
        <div class="chat-preview">
          <span class="truncate">${esc(preview)}</span>
          ${(!STATE.isSelectMode && unread) ? `<em class="badge">${unread}</em>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

$('#list-chats').addEventListener('click', e => {
  const item = e.target.closest('[data-chat]');
  if (!item) return;
  const chatId = item.dataset.chat;
  if (STATE.isSelectMode) {
    if (STATE.selectedChats.has(chatId)) STATE.selectedChats.delete(chatId);
    else STATE.selectedChats.add(chatId);
    renderChats();
  } else {
    openChat(chatId);
  }
});

/* --- RESTOF THE APP (STATUS, REQUESTS, CHAT SCREEN, ETC) --- */
function listenRequests() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', STATE.uid));
  STATE.unsubRequests = onSnapshot(q, snap => {
    STATE.requests = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.isBanned && (c.pendingFor || []).includes(STATE.uid));
    renderRequests();
  });
}
function renderRequests() {
  const list = $('#list-requests'); const badge = $('#req-badge');
  if (!STATE.requests.length) { list.innerHTML = `<div class="empty">Tidak ada permintaan pesan baru.</div>`; }
  else {
    list.innerHTML = STATE.requests.map(req => {
      const initiator = (req.members || []).find(u => u !== STATE.uid);
      const name = req.memberNames?.[initiator] || 'Pengguna';
      const tick = (req.memberVerified && req.memberVerified[initiator]) ? BLUE_TICK_SVG : '';
      return `<div class="req-item" data-req="${req.id}">
        <div class="req-head">${avatarHTML(name, req.memberPhotos?.[initiator])}<div class="req-head-info"><strong class="truncate">${esc(name)} ${tick}</strong><span>@${esc(req.memberUsernames?.[initiator] || 'pengguna')}</span></div></div>
        <p class="req-msg">${esc(req.lastMessage?.text || 'Halo, boleh kenalan?')}</p>
        <div class="req-actions">
          <button type="button" class="btn btn-reject" data-act="reject">Tolak &amp; Blokir</button>
          <button type="button" class="btn btn-accept" data-act="accept">Terima</button>
        </div>
      </div>`;
    }).join('');
  }
  badge.textContent = STATE.requests.length; badge.classList.toggle('hidden', STATE.requests.length === 0);
}
$('#list-requests').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const reqId = btn.closest('[data-req]').dataset.req;
  if (btn.dataset.act === 'accept') { await updateDoc(doc(db, 'chats', reqId), { pendingFor: arrayRemove(STATE.uid) }); openChat(reqId); }
  else {
    await updateDoc(doc(db, 'chats', reqId), { pendingFor: arrayRemove(STATE.uid), rejected: arrayUnion(STATE.uid) });
    const req = STATE.requests.find(r => r.id === reqId);
    if (req) { const o = (req.members || []).find(u => u !== STATE.uid); if(o) await updateDoc(doc(db, 'users', STATE.uid), { blocked: arrayUnion(o) }); }
    await deleteDoc(doc(db, 'chats', reqId)); toast('Permintaan ditolak');
  }
});

function listenStatuses() {
  const q = query(collection(db, 'status'), orderBy('createdAt', 'desc'), limit(50));
  STATE.unsubStatuses = onSnapshot(q, snap => {
    const now = Date.now();
    STATE.statuses = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => !s.isBanned && s.expiresAt?.toMillis?.() > now);
    renderStatuses();
  });
}
function renderStatuses() {
  const list = $('#list-status');
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid);
  const otherStatuses = STATE.statuses.filter(s => s.userId !== STATE.uid);
  const myCard = $('#status-add');
  if (myStatuses.length > 0) {
    myCard.innerHTML = `<div class="status-ring" style="padding:2px;background:linear-gradient(140deg,#13c08d,#0a7c66);border-radius:50%;box-shadow:none">${avatarHTML(myStatuses[0].userName, myStatuses[0].userPhoto, '', 'my-status-avatar')}</div><div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">${myStatuses.length} pembaruan · ketuk untuk kelola</p></div><span class="plus-dot">+</span>`;
  } else {
    myCard.innerHTML = `${avatarHTML(STATE.me.displayName, STATE.me.photoURL, '', 'my-status-avatar')}<div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">Ketuk untuk menambah</p></div><span class="plus-dot">+</span>`;
  }
  myCard.onclick = openMyStatusesModal;
  if (!otherStatuses.length) { list.innerHTML = `<div class="empty">Belum ada status lain.</div>`; return; }
  list.innerHTML = otherStatuses.map(s => `<div class="status-item" data-status="${s.id}"><div class="status-ring ${(s.viewers || []).includes(STATE.uid) ? 'seen' : ''}">${avatarHTML(s.userName, s.userPhoto)}</div><div class="status-info"><strong class="truncate">${esc(s.userName)}</strong><span>${esc(fmtRel(s.createdAt))}</span></div><span class="status-badge">${s.type === 'image' ? '📷' : '📝'}</span></div>`).join('');
}
function openMyStatusesModal() {
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid);
  showModal(`<div class="modal-header"><h3>Status Saya (${myStatuses.length})</h3></div><div class="modal-body"><button class="btn btn-primary" id="ms-add">+ Tambah Status Baru</button><div id="ms-list">${myStatuses.length ? myStatuses.map(s => `<div class="status-item" style="cursor:default"><div class="status-ring">${avatarHTML(s.userName, s.userPhoto)}</div><div class="status-info"><strong>${esc(s.type === 'image' ? '📷 Foto' : '📝 Teks')}</strong><span>${esc(fmtRel(s.createdAt))}</span></div><button class="btn btn-soft sm" data-ms-view="${s.id}" style="padding:8px 12px;font-size:12px">Lihat</button><button class="btn btn-danger sm" data-ms-del="${s.id}" style="padding:8px 12px;font-size:12px">🗑</button></div>`).join('') : '<p class="muted small center">Belum ada status.</p>'}</div></div><div class="modal-footer"><button class="btn btn-soft" id="ms-close">Tutup</button></div>`, root => {
    root.querySelector('#ms-close').onclick = closeModal;
    root.querySelector('#ms-add').onclick = () => { closeModal(); openNewStatusModal(); };
    root.querySelectorAll('[data-ms-view]').forEach(b => b.onclick = () => { const s = STATE.statuses.find(x => x.id === b.dataset.msView); if(s){closeModal();openStatusViewer(s);} });
    root.querySelectorAll('[data-ms-del]').forEach(b => b.onclick = async () => { if(confirm('Hapus?')){await deleteDoc(doc(db,'status',b.dataset.msDel));closeModal();} });
  });
}
$('#list-status').addEventListener('click', e => {
  const item = e.target.closest('[data-status]'); if (!item) return;
  const s = STATE.statuses.find(x => x.id === item.dataset.status); if (s) openStatusViewer(s);
});
function openStatusViewer(s) {
  const isMine = s.userId === STATE.uid; const wrap = document.createElement('div'); wrap.className = 'status-viewer';
  wrap.innerHTML = `<div class="sv-header">${avatarHTML(s.userName, s.userPhoto, 'sm')}<div class="info"><strong>${esc(s.userName)}</strong><small>${esc(fmtRel(s.createdAt))}</small></div>${isMine ? `<button class="icon-btn ghost-light" id="sv-delete" style="margin-right:10px">🗑</button>` : ''}<button class="icon-btn ghost-light" id="sv-close">✕</button></div><div class="sv-body">${s.type === 'image' && s.photoURL ? `<img src="${esc(s.photoURL)}">${s.content ? `<p style="margin-top:16px;font-size:16px">${esc(s.content)}</p>` : ''}` : `<p>${esc(s.content)}</p>`}</div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#sv-close').onclick = async () => { if(!isMine){try{await updateDoc(doc(db,'status',s.id),{viewers:arrayUnion(STATE.uid)});}catch{}} wrap.remove(); };
  if(isMine) wrap.querySelector('#sv-delete').onclick = async () => { if(confirm('Hapus?')){await deleteDoc(doc(db,'status',s.id));wrap.remove();} };
}

function openNewStatusModal() {
  showModal(`<div class="modal-header"><h3>Buat Status</h3></div><div class="modal-body"><label class="field"><span>Status teks</span><div class="input-wrap"><input id="status-text" type="text" maxlength="120" placeholder="Apa yang kamu pikirkan?"></div></label><p class="muted small">Atau unggah foto (opsional).</p><button type="button" class="btn btn-soft" id="status-photo-btn">📷 Pilih Foto</button></div><div class="modal-footer"><button class="btn btn-soft" id="status-cancel">Batal</button><button class="btn btn-primary" id="status-save">Bagikan</button></div>`, root => {
    let photoFile = null;
    root.querySelector('#status-cancel').onclick = closeModal;
    root.querySelector('#status-photo-btn').onclick = () => {
      const fi = document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none'; document.body.appendChild(fi);
      fi.onchange = e => { photoFile = e.target.files?.[0]; if(photoFile){ if(photoFile.size>10485760){toast('Maks 10MB');photoFile=null;} else {root.querySelector('#status-photo-btn').textContent='📷 '+photoFile.name;} } document.body.removeChild(fi); };
      fi.click();
    };
    root.querySelector('#status-save').onclick = async () => {
      const text = root.querySelector('#status-text').value.trim();
      if(!text && !photoFile){toast('Isi status/foto');return;}
      const btn = root.querySelector('#status-save'); btn.disabled=true; btn.textContent='Memproses…';
      try {
        let url=''; if(photoFile) url=await uploadToCloudinary(photoFile);
        await addDoc(collection(db,'status'),{userId:STATE.uid,userName:STATE.me.displayName,userPhoto:STATE.me.photoURL||'',type:photoFile?'image':'text',content:text,photoURL:url,viewers:[],createdAt:serverTimestamp(),expiresAt:Timestamp.fromMillis(Date.now()+86400000)});
        toast('Status dibagikan'); closeModal();
      } catch(e){toast('Gagal: '+e.message); btn.disabled=false; btn.textContent='Bagikan';}
    };
  });
}

/* --- CHAT SCREEN --- */
$('#chat-back').addEventListener('click', () => { if(STATE.unsubMsgs){STATE.unsubMsgs();STATE.unsubMsgs=null;} STATE.currentChat=null; showScreen('screen-home'); });
$('#chat-header').addEventListener('click', (e) => {
  if (e.target.closest('#chat-back') || e.target.closest('#chat-menu')) return;
  if (STATE.currentChat && STATE.currentChat.type === 'group') openGroupSettings(STATE.currentChat.id);
});

async function openChat(chatId) {
  const snap = await getDoc(doc(db, 'chats', chatId));
  if (!snap.exists()) return;
  const data = snap.data();
  if (data.isBanned) { toast('Chat diblokir admin.'); return; }
  if (data.pins && data.pins[STATE.uid]) {
    showModal(`<div class="modal-header"><h3>Chat Terkunci 🔒</h3></div><div class="modal-body"><label class="field"><span>PIN</span><div class="input-wrap"><input id="unlock-pin" type="password" maxlength="6"></div></label></div><div class="modal-footer"><button class="btn btn-soft" id="unlock-cancel">Batal</button><button class="btn btn-primary" id="unlock-btn">Buka</button></div>`, r => {
      r.querySelector('#unlock-cancel').onclick = closeModal;
      r.querySelector('#unlock-btn').onclick = () => { if(r.querySelector('#unlock-pin').value === data.pins[STATE.uid]) { closeModal(); proceedOpenChat(chatId, data); } else toast('PIN salah'); };
    }); return;
  }
  proceedOpenChat(chatId, data);
}

function proceedOpenChat(chatId, chat) {
  STATE.currentChat = { id: chatId, ...chat }; STATE.replyTo = null; STATE.timerSec = 0; hideReplyBar();
  const name = chatDisplayName(chat); const photo = chatDisplayPhoto(chat); const tick = getChatTick(chat);
  $('#chat-name').innerHTML = esc(name) + tick;
  $('#chat-sub').textContent = chat.type === 'self' ? 'Catatan pribadi' : (chat.type === 'group' ? (chat.members?.length || 0) + ' anggota' : '@' + (chat.memberUsernames?.[chat.members.find(u => u !== STATE.uid)] || '—'));
  setAvatarEl($('#chat-avatar'), name, photo, 'sm');
  if ((chat.unread || {})[STATE.uid]) updateDoc(doc(db, 'chats', chatId), { ['unread.'+STATE.uid]: 0 });
  showScreen('screen-chat');
  if (STATE.unsubMsgs) STATE.unsubMsgs();
  listenMessages(chatId);
}

function listenMessages(chatId) {
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(300));
  STATE.unsubMsgs = onSnapshot(q, snap => {
    const now = Date.now();
    STATE.currentChat.messages = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !(m.deletedFor||[]).includes(STATE.uid) && (!m.expiresAt || m.expiresAt.toMillis() > now));
    renderMessages();
  });
}

function renderMessages() {
  const chat = STATE.currentChat; if (!chat) return;
  const box = $('#chat-body'); const msgs = chat.messages || [];
  if (!msgs.length) { box.innerHTML = `<div class="day-divider">Belum ada pesan</div>`; return; }
  box.innerHTML = `<div class="day-divider">Percakapan</div>` + msgs.map(m => {
    if (m.type === 'system') {
      return `<div class="msg sys"><div class="bubble">${esc(m.text)}</div></div>`;
    }
    const isOut = m.senderId === STATE.uid; const time = fmtTime(m.createdAt);
    const check = isOut ? (m.status === 'read' ? '<span class="checks read">✓✓</span>' : '<span class="checks">✓</span>') : '';
    const sender = (!isOut && chat.type === 'group') ? `<div class="sender-name">${esc(m.senderName || '')}</div>` : '';
    let body = m.isDeletedForEveryone ? '<span class="deleted">Dihapus</span>' : esc(m.text || '');
    if (m.type === 'image' && m.mediaUrl) body = `<img src="${esc(m.mediaUrl)}" class="chat-img" onclick="window.open('${esc(m.mediaUrl)}','_blank')">`;
    const reply = m.replyTo ? `<div class="reply-preview"><b>${esc(m.replyTo.senderName || '')}</b><br>${esc(m.replyTo.text || '')}</div>` : '';
    return `<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble">${sender}${reply}${body}<span class="meta">${esc(time)} ${check}</span></div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(text, type = 'text', mediaUrl = null) {
  const chat = STATE.currentChat; if (!chat || (!text.trim() && !mediaUrl)) return;
  if (chat.type === 'group' && chat.onlyAdminsCanChat) {
    const isAdmin = chat.createdBy === STATE.uid || (chat.admins || []).includes(STATE.uid);
    if (!isAdmin) { toast('Hanya Admin yang bisa chat di grup ini'); return; }
  }
  const payload = {
    senderId: STATE.uid, senderName: STATE.me.displayName, text: text.trim(), type: type, status: 'sent',
    createdAt: serverTimestamp(), replyTo: STATE.replyTo ? { text: STATE.replyTo.text || '📎', senderName: STATE.replyTo.senderName } : null,
    timer: STATE.timerSec || 0, isDeletedForEveryone: false, deletedFor: []
  };
  if (mediaUrl) payload.mediaUrl = mediaUrl;
  if (STATE.timerSec) payload.expiresAt = Timestamp.fromMillis(Date.now() + STATE.timerSec * 1000);
  await addDoc(collection(db, 'chats', chat.id, 'messages'), payload);
  const unread = {}; (chat.members || []).filter(u => u !== STATE.uid).forEach(u => unread['unread.'+u] = ((chat.unread||{})[u]||0)+1);
  await updateDoc(doc(db, 'chats', chat.id), { lastMessage: { text: type==='image'?'📷 Foto':payload.text, senderId: STATE.uid, senderName: STATE.me.displayName, createdAt: serverTimestamp() }, updatedAt: serverTimestamp(), ...unread });
  STATE.replyTo = null; STATE.timerSec = 0; hideReplyBar(); $('#chat-input').value = '';
}

$('#composer').addEventListener('submit', e => { e.preventDefault(); sendMessage($('#chat-input').value).catch(e => toast('Error: '+e.message)); });
$('#btn-attach').addEventListener('click', () => $('#chat-media-input').click());
$('#chat-media-input').addEventListener('change', async e => {
  const file = e.target.files?.[0]; if (!file) return;
  if (file.size > 10485760) { toast('Maks 10MB'); e.target.value=''; return; }
  toast('Mengunggah…');
  try { const url = await uploadToCloudinary(file); await sendMessage('', 'image', url); toast('Terkirim'); } catch(err){ toast('Gagal: '+err.message); }
  e.target.value='';
});

$('#chat-body').addEventListener('click', async e => {
  const msgEl = e.target.closest('[data-mid]'); if (!msgEl) return;
  const mid = msgEl.dataset.mid; const msg = (STATE.currentChat?.messages||[]).find(m=>m.id===mid); if(!msg || msg.type==='system') return;
  const isOut = msg.senderId === STATE.uid;
  showModal(`<div class="modal-header"><h3>Pesan</h3></div><div class="menu-list"><button class="menu-item" id="m-reply">↩ Balas</button><button class="menu-item" id="m-copy">📋 Salin</button><button class="menu-item" id="m-del-me">🗑 Hapus untuk Saya</button>${isOut?'<button class="menu-item" id="m-del-all" style="color:red">🗑 Hapus untuk Semua</button>':''}</div>`, r => {
    r.querySelector('#m-reply').onclick = () => { STATE.replyTo = msg; $('#reply-name').textContent = msg.senderName; $('#reply-text').textContent = msg.text || '📎'; $('#reply-bar').classList.remove('hidden'); closeModal(); };
    r.querySelector('#m-copy').onclick = () => { navigator.clipboard.writeText(msg.text||''); toast('Disalin'); closeModal(); };
    r.querySelector('#m-del-me').onclick = async () => { await updateDoc(doc(db,'chats',STATE.currentChat.id,'messages',mid),{deletedFor:arrayUnion(STATE.uid)}); closeModal(); };
    if(isOut) r.querySelector('#m-del-all').onclick = async () => { await updateDoc(doc(db,'chats',STATE.currentChat.id,'messages',mid),{isDeletedForEveryone:true,text:'',mediaUrl:null}); closeModal(); };
  });
});
$('#reply-cancel').addEventListener('click', () => { STATE.replyTo = null; hideReplyBar(); });
function hideReplyBar() { $('#reply-bar').classList.add('hidden'); }

/* --- GROUP SETTINGS & MANAGEMENT --- */
async function openGroupSettings(chatId) {
  const snap = await getDoc(doc(db, 'chats', chatId));
  const c = snap.data();
  const isOwner = c.createdBy === STATE.uid;
  const isAdmin = (c.admins || []).includes(STATE.uid) || isOwner;
  const canEdit = isOwner || isAdmin;

  const memberListHtml = (c.members || []).map(uid => {
    const isUserOwner = uid === c.createdBy;
    const isUserAdmin = (c.admins || []).includes(uid);
    const name = c.memberNames?.[uid] || 'Unknown';
    const badge = isUserOwner ? '<span class="badge-owner">Pemilik</span>' : (isUserAdmin ? '<span class="badge-admin">Admin</span>' : '');
    let actions = '';
    if (canEdit && !isUserOwner && uid !== STATE.uid) {
      actions = `<button class="btn btn-danger sm" data-kick="${uid}" style="padding:6px 10px;font-size:11px">Keluarkan</button>`;
      if (isOwner) {
        actions = `<button class="btn btn-soft sm" data-toggle-admin="${uid}" data-is-admin="${isUserAdmin}" style="padding:6px 10px;font-size:11px;margin-right:5px">${isUserAdmin?'Cabut Admin':'Jadikan Admin'}</button>` + actions;
      }
    }
    return `<div class="member-item">${avatarHTML(name, c.memberPhotos?.[uid], 'sm')}<div class="member-info"><strong>${esc(name)} ${uid===STATE.uid?'(Kamu)':''} ${badge}</strong></div>${actions}</div>`;
  }).join('');

  showModal(`
    <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">
      <h3>Info Grup</h3>
      <button class="icon-btn" id="gs-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-header">
        <div id="gs-photo-wrapper" style="position:relative;cursor:${canEdit?'pointer':'default'}">
          ${avatarHTML(c.name, c.photoURL, 'lg', 'gs-photo')}
          ${canEdit ? '<div style="position:absolute;bottom:0;right:0;background:var(--primary);color:#fff;border-radius:50%;padding:5px;font-size:12px;border:2px solid #fff">📷</div>' : ''}
        </div>
        ${canEdit ? `<input class="settings-group-title" id="gs-name-input" value="${esc(c.name)}" style="border-bottom:1px dashed var(--primary);text-align:center;width:100%;">` : `<h2 class="settings-group-title">${esc(c.name)}</h2>`}
        <p class="muted small">${c.members.length} Anggota</p>
        ${canEdit ? `<button class="btn btn-primary sm" id="gs-save-name" style="width:100%">Simpan Perubahan</button>` : ''}
      </div>

      <div class="list-card" style="margin-bottom:15px">
        <label class="row">
          <span>Hanya Admin yang bisa chat</span>
          <input type="checkbox" class="switch" id="gs-only-admin-chat" ${c.onlyAdminsCanChat?'checked':''} ${canEdit?'':'disabled'}>
        </label>
        <label class="row">
          <span>Siapa yang bisa tambah anggota</span>
          <select id="gs-who-can-add" ${canEdit?'':'disabled'}>
            <option value="everyone" ${c.whoCanAddMembers==='everyone'?'selected':''}>Semua Anggota</option>
            <option value="admins" ${c.whoCanAddMembers==='admins'?'selected':''}>Hanya Admin</option>
          </select>
        </label>
      </div>

      <p class="section-title">Anggota Grup</p>
      <div class="list-card" style="padding:10px 14px">${memberListHtml}</div>
    </div>
    <div class="modal-footer" style="flex-direction:column;gap:10px">
      <button class="btn btn-danger" id="gs-leave" style="width:100%">Keluar Grup</button>
      ${isOwner ? `<button class="btn btn-danger" id="gs-disband" style="width:100%;background:#b91c1c">Bubarkan Grup</button>` : ''}
    </div>
  `, root => {
    root.querySelector('#gs-close').onclick = closeModal;

    // Save name
    if (canEdit) {
      root.querySelector('#gs-save-name').onclick = async () => {
        const newName = root.querySelector('#gs-name-input').value.trim();
        if (!newName) return toast('Nama kosong');
        await updateDoc(doc(db, 'chats', chatId), { name: newName });
        toast('Nama diperbarui'); closeModal();
        if (STATE.currentChat?.id === chatId) proceedOpenChat(chatId, { ...c, name: newName });
      };
    }

    // Change photo
    root.querySelector('#gs-photo-wrapper').onclick = () => {
      if (!canEdit) return;
      const fi = document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none'; document.body.appendChild(fi);
      fi.onchange = async e => {
        const file = e.target.files?.[0]; if(!file) return;
        toast('Mengunggah foto…');
        try {
          const url = await uploadToCloudinary(file);
          await updateDoc(doc(db, 'chats', chatId), { photoURL: url });
          toast('Foto grup diubah');
          root.querySelector('#gs-photo').outerHTML = avatarHTML(c.name, url, 'lg', 'gs-photo');
        } catch(err){ toast('Gagal: '+err.message); }
        document.body.removeChild(fi);
      };
      fi.click();
    };

    // Toggles
    const toggleAdminChat = root.querySelector('#gs-only-admin-chat');
    if(toggleAdminChat) toggleAdminChat.onchange = async (e) => {
      await updateDoc(doc(db, 'chats', chatId), { onlyAdminsCanChat: e.target.checked });
      toast('Pengaturan chat diperbarui');
    };

    const selAdd = root.querySelector('#gs-who-can-add');
    if(selAdd) selAdd.onchange = async (e) => {
      await updateDoc(doc(db, 'chats', chatId), { whoCanAddMembers: e.target.value });
      toast('Pengaturan anggota diperbarui');
    };

    // Kick
    root.querySelectorAll('[data-kick]').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.kick;
        if (!confirm('Keluarkan anggota ini?')) return;
        const memberNames = { ...c.memberNames }; delete memberNames[uid];
        const memberPhotos = { ...c.memberPhotos }; delete memberPhotos[uid];
        const memberUsernames = { ...c.memberUsernames }; delete memberUsernames[uid];
        const unread = { ...c.unread }; delete unread[uid];
        await updateDoc(doc(db, 'chats', chatId), {
          members: arrayRemove(uid), admins: arrayRemove(uid),
          memberNames, memberPhotos, memberUsernames, unread
        });
        await addDoc(collection(db, 'chats', chatId, 'messages'), {
          type: 'system', text: `${STATE.me.displayName} telah mengeluarkan ${c.memberNames[uid]}`, createdAt: serverTimestamp()
        });
        toast('Anggota dikeluarkan'); closeModal();
      };
    });

    // Toggle Admin
    root.querySelectorAll('[data-toggle-admin]').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.toggleAdmin;
        const isAdm = btn.dataset.isAdmin === 'true';
        if (isAdm) {
          await updateDoc(doc(db, 'chats', chatId), { admins: arrayRemove(uid) });
          toast('Admin dicabut');
        } else {
          await updateDoc(doc(db, 'chats', chatId), { admins: arrayUnion(uid) });
          toast('Dijadikan Admin');
          await addDoc(collection(db, 'chats', chatId, 'messages'), { type:'system', text:`${STATE.me.displayName} menjadikan ${c.memberNames[uid]} sebagai Admin`, createdAt: serverTimestamp() });
        }
        closeModal();
      };
    });

    // Leave group
    root.querySelector('#gs-leave').onclick = async () => {
      if (!confirm('Keluar dari grup ini?')) return;
      const memberNames = { ...c.memberNames }; delete memberNames[STATE.uid];
      const memberPhotos = { ...c.memberPhotos }; delete memberPhotos[STATE.uid];
      const memberUsernames = { ...c.memberUsernames }; delete memberUsernames[STATE.uid];
      const unread = { ...c.unread }; delete unread[STATE.uid];
      await updateDoc(doc(db, 'chats', chatId), {
        members: arrayRemove(STATE.uid), admins: arrayRemove(STATE.uid),
        memberNames, memberPhotos, memberUsernames, unread
      });
      await addDoc(collection(db, 'chats', chatId, 'messages'), { type: 'system', text: `${STATE.me.displayName} telah keluar dari grup`, createdAt: serverTimestamp() });
      toast('Kamu keluar grup'); closeModal(); $('#chat-back').click();
    };

    // Disband group
    if (isOwner) {
      root.querySelector('#gs-disband').onclick = async () => {
        if (!confirm('Bubarkan grup ini untuk semua orang? Tindakan ini permanen.')) return;
        try {
          const msgs = await getDocs(collection(db, 'chats', chatId, 'messages'));
          const batch = writeBatch(db);
          msgs.forEach(m => batch.delete(m.ref));
          batch.delete(doc(db, 'chats', chatId));
          await batch.commit();
          toast('Grup dibubarkan'); closeModal(); $('#chat-back').click();
        } catch(e) { toast('Gagal: '+e.message); }
      };
    }
  });
}

/* --- ADD MEMBER LOGIC (DARI MENU CHAT) --- */
$('#chat-menu').addEventListener('click', () => {
  const isGroup = STATE.currentChat?.type === 'group';
  showModal(`
    <div class="modal-header"><h3>Opsi Chat</h3></div>
    <div class="menu-list">
      ${isGroup ? `<button class="menu-item" id="cm-add-member">👥 Tambah Anggota</button>` : ''}
      <button class="menu-item" id="cm-mute">🔕 Bisukan / Aktifkan</button>
      <button class="menu-item" id="cm-lock">🔒 Kunci dengan PIN</button>
      <button class="menu-item" id="cm-clear" style="color:#e5484d">🗑 Kosongkan Chat</button>
    </div>
  `, root => {
    root.querySelector('#cm-mute').onclick = async () => {
      const isMuted = (STATE.currentChat.mutedBy||[]).includes(STATE.uid);
      await updateDoc(doc(db,'chats',STATE.currentChat.id),{mutedBy:isMuted?arrayRemove(STATE.uid):arrayUnion(STATE.uid)});
      toast(isMuted?'Aktif':'Dibisukan'); closeModal();
    };
    root.querySelector('#cm-lock').onclick = () => {
      showModal(`<div class="modal-header"><h3>Kunci PIN</h3></div><div class="modal-body"><input type="password" id="pin-in" maxlength="6" placeholder="PIN 4-6 angka" class="input-wrap" style="padding:10px;width:100%"></div><div class="modal-footer"><button class="btn btn-soft" id="p-cancel">Batal</button><button class="btn btn-primary" id="p-save">Simpan</button></div>`, r2 => {
        r2.querySelector('#p-cancel').onclick = closeModal;
        r2.querySelector('#p-save').onclick = async () => { const p = r2.querySelector('#pin-in').value; if(/^\d{4,6}$/.test(p)){await updateDoc(doc(db,'chats',STATE.currentChat.id),{[`pins.${STATE.uid}`]:p});closeModal();toast('Terkunci');}else toast('Format salah'); };
      });
    };
    root.querySelector('#cm-clear').onclick = async () => {
      if(!confirm('Hapus semua pesan?')) return;
      const s = await getDocs(collection(db,'chats',STATE.currentChat.id,'messages')); const b = writeBatch(db); s.forEach(d=>b.delete(d.ref)); await b.commit();
      await updateDoc(doc(db,'chats',STATE.currentChat.id),{lastMessage:null}); toast('Chat kosong'); closeModal();
    };
    if(isGroup) {
      root.querySelector('#cm-add-member').onclick = () => {
        if (STATE.currentChat.whoCanAddMembers === 'admins') {
          const isAdm = STATE.currentChat.createdBy === STATE.uid || (STATE.currentChat.admins||[]).includes(STATE.uid);
          if (!isAdm) { toast('Hanya Admin yang bisa tambah anggota'); return; }
        }
        closeModal();
        openAddMemberModal();
      };
    }
  });
});

function openAddMemberModal() {
  showModal(`<div class="modal-header"><h3>Tambah Anggota</h3></div><div class="modal-body"><input type="text" id="am-search" placeholder="Cari username…" class="input-wrap" style="padding:10px;width:100%"><div id="am-results"></div></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>`, root => {
    const input = root.querySelector('#am-search'); const res = root.querySelector('#am-results');
    let t; input.addEventListener('input', () => {
      clearTimeout(t); t = setTimeout(async () => {
        const q = input.value.toLowerCase().trim(); if(q.length<2) return;
        const snap = await getDocs(query(collection(db,'users'),where('username','>=',q),where('username','<=',q+'\uf8ff'),limit(5)));
        res.innerHTML = snap.docs.map(d => {
          const u = d.data();
          if (STATE.currentChat.members.includes(d.id)) return `<div class="search-result"><div class="info"><strong>${esc(u.displayName)}</strong><span>Sudah di grup</span></div></div>`;
          return `<div class="search-result" data-add="${d.id}" data-name="${esc(u.displayName)}" data-photo="${esc(u.photoURL||'')}" data-uname="${esc(u.username)}">${avatarHTML(u.displayName,u.photoURL,'sm')}<div class="info"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username)}</span></div></div>`;
        }).join('');
        res.querySelectorAll('[data-add]').forEach(el => {
          el.onclick = async () => {
            const uid = el.dataset.add;
            const names = { ...STATE.currentChat.memberNames, [uid]: el.dataset.name };
            const photos = { ...STATE.currentChat.memberPhotos, [uid]: el.dataset.photo };
            const unames = { ...STATE.currentChat.memberUsernames, [uid]: el.dataset.uname };
            await updateDoc(doc(db,'chats',STATE.currentChat.id), { members: arrayUnion(uid), memberNames: names, memberPhotos: photos, memberUsernames: unames });
            await addDoc(collection(db,'chats',STATE.currentChat.id,'messages'), { type:'system', text:`${STATE.me.displayName} telah menambahkan ${el.dataset.name}`, createdAt: serverTimestamp() });
            toast('Ditambahkan'); closeModal();
          };
        });
      }, 300);
    });
  });
}

/* --- PROFILE, PRIVACY, LOGOUT, GROUP CREATION, NAV (SAMA SEPERTI SEBELUMNYA) --- */
$('#btn-edit-profile').addEventListener('click', () => {
  showModal(`<div class="modal-header"><h3>Edit Profil</h3></div><div class="modal-body"><label class="field"><span>Nama</span><input id="en" class="input-wrap" style="padding:10px;width:100%" value="${esc(STATE.me.displayName)}"></label><label class="field"><span>Bio</span><input id="eb" class="input-wrap" style="padding:10px;width:100%" value="${esc(STATE.me.bio||'')}"></label></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="es">Simpan</button></div>`, r=>{
    r.querySelector('#es').onclick = async () => { await updateDoc(doc(db,'users',STATE.uid),{displayName:r.querySelector('#en').value.trim(),bio:r.querySelector('#eb').value.trim()}); STATE.me.displayName=r.querySelector('#en').value; STATE.me.bio=r.querySelector('#eb').value; updateProfileUI(); closeModal(); };
  });
});
$('#btn-change-photo').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', async e => {
  const f = e.target.files?.[0]; if(!f) return; toast('Upload…');
  try{ const url = await uploadToCloudinary(f); await updateDoc(doc(db,'users',STATE.uid),{photoURL:url}); STATE.me.photoURL=url; updateProfileUI(); toast('Berhasil'); }catch(err){toast(err.message);}
  e.target.value='';
});
$('#priv-who').addEventListener('change', e => updateDoc(doc(db,'users',STATE.uid),{'privacy.whoCanMessage':e.target.value}));
$('#priv-online').addEventListener('change', e => updateDoc(doc(db,'users',STATE.uid),{'privacy.hideOnline':e.target.checked}));
$('#priv-receipt').addEventListener('change', e => updateDoc(doc(db,'users',STATE.uid),{'privacy.hideReceipt':e.target.checked}));
$('#priv-focus').addEventListener('change', e => updateDoc(doc(db,'users',STATE.uid),{'privacy.focus':e.target.checked}));
$('#btn-focus').addEventListener('click', () => { const v = !STATE.me.privacy?.focus; updateDoc(doc(db,'users',STATE.uid),{'privacy.focus':v}); STATE.me.privacy.focus=v; $('#priv-focus').checked=v; toast(v?'Fokus Aktif':'Nonaktif'); });
async function doLogout() { detachListeners(); await signOut(auth); }
$('#btn-logout').onclick = doLogout; $('#btn-logout-2').onclick = doLogout;

$$('.nav-btn').forEach(b => b.addEventListener('click', () => {
  $$('.nav-btn').forEach(x=>x.classList.toggle('active',x===b)); $$('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+b.dataset.tab)); $('#content').scrollTop=0;
}));

$$('.seg-btn').forEach(b => b.addEventListener('click', () => {
  $$('.seg-btn').forEach(x=>x.classList.toggle('active',x===b)); $('#form-login').classList.toggle('hidden',b.dataset.auth!=='login'); $('#form-register').classList.toggle('hidden',b.dataset.auth!=='register');
}));

$('#form-login').addEventListener('submit', async e => { e.preventDefault(); const b=$('#btn-login'); b.disabled=true; b.textContent='…'; try{await loginUser($('#login-user').value,$('#login-pass').value);}catch(err){toast('Gagal: '+err.message);} b.disabled=false; b.textContent='Masuk'; });
$('#form-register').addEventListener('submit', async e => { e.preventDefault(); const b=$('#btn-register'); b.disabled=true; b.textContent='…'; try{await registerUser($('#reg-name').value,$('#reg-user').value,$('#reg-pass').value);}catch(err){toast('Gagal: '+err.message);} b.disabled=false; b.textContent='Buat Akun'; });

$('#fab').addEventListener('click', () => {
  showModal(`<div class="modal-header"><h3>Aksi Baru</h3></div><div class="menu-list"><button class="menu-item" id="mnc">💬 Chat Baru</button><button class="menu-item" id="mng">👥 Buat Grup</button><button class="menu-item" id="mns">◍ Buat Status</button></div>`, r=>{
    r.querySelector('#mnc').onclick = () => { closeModal(); openNewChatModal(); };
    r.querySelector('#mng').onclick = () => { closeModal(); openNewGroupModal(); };
    r.querySelector('#mns').onclick = () => { closeModal(); openNewStatusModal(); };
  });
});

function openNewChatModal() {
  showModal(`<div class="modal-header"><h3>Chat Baru</h3></div><div class="modal-body"><input id="sc-u" class="input-wrap" style="padding:10px;width:100%" placeholder="Cari username…"><div id="sc-r" style="margin-top:10px"></div></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>`, r=>{
    const inp = r.querySelector('#sc-u'); const res = r.querySelector('#sc-r');
    let t; inp.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(async()=>{
      if(inp.value.length<2){res.innerHTML='';return;}
      const s = await getDocs(query(collection(db,'users'),where('username','>=',inp.value.toLowerCase()),where('username','<=',inp.value.toLowerCase()+'\uf8ff'),limit(10)));
      res.innerHTML = s.docs.map(d=>{const u=d.data(); if(u.uid===STATE.uid)return ''; return `<div class="search-result" data-uid="${d.id}">${avatarHTML(u.displayName,u.photoURL,'sm')}<div class="info"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username)}</span></div></div>`}).join('');
      res.querySelectorAll('.search-result').forEach(el=>{el.onclick=()=>startChatWith(el.dataset.uid);});
    },300); });
  });
}

async function startChatWith(uid) {
  closeModal();
  const s = await getDocs(query(collection(db,'chats'),where('members','array-contains',STATE.uid)));
  for(const d of s.docs){ if(d.data().type==='direct' && (d.data().members||[]).includes(uid)){ openChat(d.id); return; } }
  const t = (await getDoc(doc(db,'users',uid))).data();
  const docRef = await addDoc(collection(db,'chats'),{
    type:'direct',members:[STATE.uid,uid],memberNames:{[STATE.uid]:STATE.me.displayName,[uid]:t.displayName},memberPhotos:{[STATE.uid]:STATE.me.photoURL||'',[uid]:t.photoURL||''},memberUsernames:{[STATE.uid]:STATE.me.username,[uid]:t.username},memberVerified:{[STATE.uid]:STATE.me.isVerified||false,[uid]:t.isVerified||false},pendingFor:t.privacy?.whoCanMessage==='contacts'?[uid]:[],unread:{},lastMessage:null,updatedAt:serverTimestamp(),createdAt:serverTimestamp()
  });
  openChat(docRef.id);
}

function openNewGroupModal() {
  showModal(`<div class="modal-header"><h3>Buat Grup</h3></div><div class="modal-body"><input id="g-n" class="input-wrap" style="padding:10px;width:100%;margin-bottom:10px" placeholder="Nama Grup"><input id="g-s" class="input-wrap" style="padding:10px;width:100%" placeholder="Cari anggota…"><div id="g-r"></div><div id="g-sel" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px"></div></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="g-c">Buat</button></div>`, r=>{
    const sel = new Map(); const inp = r.querySelector('#g-s'); const res = r.querySelector('#g-r');
    let t; inp.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(async()=>{
      if(inp.value.length<2){res.innerHTML='';return;}
      const s = await getDocs(query(collection(db,'users'),where('username','>=',inp.value.toLowerCase()),where('username','<=',inp.value.toLowerCase()+'\uf8ff'),limit(5)));
      res.innerHTML = s.docs.map(d=>{const u=d.data(); if(d.id===STATE.uid)return ''; return `<div class="search-result" data-uid="${d.id}" data-n="${esc(u.displayName)}" data-p="${esc(u.photoURL||'')}" data-un="${esc(u.username)}">${avatarHTML(u.displayName,u.photoURL,'sm')}<div class="info"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username)}</span></div></div>`}).join('');
      res.querySelectorAll('.search-result').forEach(el=>{el.onclick=()=>{
        sel.set(el.dataset.uid, {name:el.dataset.n, photo:el.dataset.p, uname:el.dataset.un});
        const c = document.createElement('span'); c.className='alias-chip'; c.textContent=el.dataset.n+' ×'; c.onclick=()=>{sel.delete(el.dataset.uid);c.remove();}; r.querySelector('#g-sel').appendChild(c);
        inp.value=''; res.innerHTML='';
      }});
    },300); });
    r.querySelector('#g-c').onclick = async () => {
      const name = r.querySelector('#g-n').value.trim(); if(!name||sel.size<1) return toast('Isi nama & anggota');
      const members = [STATE.uid, ...sel.keys()];
      const mn = {[STATE.uid]:STATE.me.displayName}; const mp = {[STATE.uid]:STATE.me.photoURL||''}; const mu = {[STATE.uid]:STATE.me.username};
      sel.forEach((v,k)=>{mn[k]=v.name;mp[k]=v.photo;mu[k]=v.uname;});
      const ref = await addDoc(collection(db,'chats'),{type:'group',name,members,memberNames:mn,memberPhotos:mp,memberUsernames:mu,createdBy:STATE.uid,admins:[],onlyAdminsCanChat:false,whoCanAddMembers:'everyone',pendingFor:[],unread:{},lastMessage:null,updatedAt:serverTimestamp(),createdAt:serverTimestamp()});
      toast('Grup dibuat'); closeModal(); openChat(ref.id);
    };
  });
}
