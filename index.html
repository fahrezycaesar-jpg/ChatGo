async function uploadToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  let response;
  try { response = await fetch(url, { method: "POST", body: formData }); } catch (e) { throw new Error("Koneksi gagal."); }
  if (!response.ok) { let m="Gagal"; try{ const d=await response.json(); m=d.error?.message||m; }catch{} throw new Error(m); }
  const data = await response.json();
  return data.secure_url;
}

  if (!messaging) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const registration = await navigator.serviceWorker.register('./sw.js');
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
      if (token && STATE.uid) await updateDoc(doc(db, 'users', STATE.uid), { fcmToken: token });
    }
  } catch (error) { console.error('Gagal setup FCM:', error); }
}

const BLUE_TICK_SVG = `<svg class="tick-svg" viewBox="0 0 24 24"><path d="M12 2L14.5 5.5L18.5 4.5L19.5 8.5L23 11L20.5 14.5L21.5 18.5L17.5 19.5L15 23L11.5 20.5L7.5 21.5L6.5 17.5L3 15L5.5 11.5L4.5 7.5L8.5 6.5L11 3L12 2Z"/><path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
const SVG_TRASH = `<svg class="svg-icon-outline" viewBox="0 0 24 24" style="width:18px;height:18px"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
const SVG_LOCK = `<svg class="svg-icon-outline" viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;

const STATE = {
  uid: null, me: null,

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailFor = u => `${u.toLowerCase().trim()}@chatgo.local`;
const AVA_COLORS = [['#12b886','#0a7c66'],['#8b5cf6','#6d28d9'],['#f59e0b','#b45309'],['#ec4899','#be185d'],['#0ea5e9','#0369a1'],['#14b8a6','#0f766e']];
const colorFor = (str) => AVA_COLORS[(str || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % AVA_COLORS.length];
const initialsFor = (name) => (name || '?').trim().slice(0, 2).toUpperCase();
const fmtTime = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}).replace('.',':'); };
const fmtRel = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); const diff = Date.now() - d.getTime(); if (diff < 60000) return 'baru saja'; if (diff < 3600000) return Math.floor(diff/60000) + 'm lalu'; if (diff < 86400000) return Math.floor(diff/3600000) + 'j lalu'; return d.toLocaleDateString('id-ID', {day:'numeric', month:'short'}); };

/* THEME */
const THEME_KEY = 'chatgo_theme';
function applyTheme(theme) {
  const isDark = theme === 'dark';
  document.documentElement.classList.toggle('dark', isDark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = isDark ? '#0a1210' : '#0fa585';
  const tgl = document.getElementById('toggle-dark-mode');
  if (tgl) tgl.checked = isDark;
}
function getPreferredTheme() {
  const saved = (() => { try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } })();
  if (saved === 'light' || saved === 'dark') return saved;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function setTheme(theme) { try { localStorage.setItem(THEME_KEY, theme); } catch(e){} applyTheme(theme); }
applyTheme(getPreferredTheme());

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function playMsgSound() { try { $('#msg-sound').currentTime = 0; $('#msg-sound').play().catch(()=>{}); } catch(e){} }

function showScreen(id) {
  $$('.screen').forEach(s => { const on = s.id === id; s.classList.toggle('active', on); s.classList.toggle('hidden', !on); });
}

function avatarHTML(name, photo, cls = '', id = '') {
  const [a, b] = colorFor(name || '?');
  const classes = 'avatar' + (cls ? ' ' + cls : '');
  const idAttr = id ? ` id="${esc(id)}"` : '';
  if (photo) return `<div class="${classes}"${idAttr}><img src="${esc(photo)}" alt=""></div>`;
  return `<div class="${classes}"${idAttr} style="--a:${a};--b:${b}">${esc(initialsFor(name))}</div>`;
}
function setAvatarEl(el, name, photo, extraCls = '') {
  if (!el) return;
  el.className = 'avatar' + (extraCls ? ' ' + extraCls : '');
  const [a, b] = colorFor(name || '?');
  el.style.setProperty('--a', a); el.style.setProperty('--b', b);
  if (photo) el.innerHTML = `<img src="${esc(photo)}" alt="">`;
  else el.innerHTML = esc(initialsFor(name));
}
function showModal(html, onMount) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal">${html}</div></div>`;
  root.classList.remove('hidden');
  root.querySelector('.modal-backdrop').addEventListener('click', e => { if (e.target.classList.contains('modal-backdrop')) closeModal(); });
  if (onMount) onMount(root);
}
function closeModal() { const root = $('#modal-root'); root.innerHTML = ''; root.classList.add('hidden'); }
window.closeModal = closeModal;

function showNotif(title, body, chatId) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const notif = new Notification(title, {
      body: body, icon: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(title) + '&background=0fa585&color=fff',
      tag: chatId, renotify: true
    });
    notif.onclick = function() { window.focus(); if (chatId) openChat(chatId); this.close(); };
  }
}

/* AUTH */
async function registerUser(displayName, username, password) {
  const uname = username.toLowerCase().trim();
  if (!/^[a-z0-9_]{3,20}$/.test(uname)) throw new Error('Username harus 3-20 karakter');
  if (password.length < 6) throw new Error('Password minimal 6 karakter');
  if (!displayName.trim()) throw new Error('Nama tampilan wajib');
  const unameSnap = await getDoc(doc(db, 'usernames', uname));
  if (unameSnap.exists()) throw new Error('Username sudah dipakai');
  const cred = await createUserWithEmailAndPassword(auth, emailFor(uname), password);
  const uid = cred.user.uid;
  await setDoc(doc(db, 'usernames', uname), { uid, createdAt: serverTimestamp() });
  await setDoc(doc(db, 'users', uid), {
    displayName: displayName.trim(), username: uname, bio: '', photoURL: '',
    privacy: { whoCanMessage: 'everyone' },
    blocked: [], hiddenChats: [], isVerified: false, isBanned: false, createdAt: serverTimestamp()
  });
  await addDoc(collection(db, 'chats'), {
    type: 'self', name: 'Catatan Pribadi', members: [uid],
    lastMessage: { text: 'Pesan tersimpan', senderId: uid, senderName: displayName },
    updatedAt: serverTimestamp(), createdAt: serverTimestamp()
  });
}
async function loginUser(username, password) {
  return signInWithEmailAndPassword(auth, emailFor(username.toLowerCase().trim()), password);
}
async function loadProfileAndShow(user) {
  let snap = null;
  for (let i = 0; i < 10; i++) { snap = await getDoc(doc(db, 'users', user.uid)); if (snap.exists()) break; await new Promise(r => setTimeout(r, 500)); }
  if (!snap || !snap.exists()) { showModal(`<div class="modal-body"><p class="muted small">Gagal memuat profil.</p></div><div class="modal-footer"><button class="btn btn-soft" onclick="location.reload()">Tutup</button></div>`); return; }
  if (snap.data().isBanned) {
    showModal(`<div class="modal-header"><h3>Akses Ditolak 🚫</h3></div><div class="modal-body"><p class="muted small">Akun Anda diblokir.</p></div><div class="modal-footer"><button class="btn btn-soft" id="banned-logout">Keluar</button></div>`, root => { root.querySelector('#banned-logout').onclick = () => { closeModal(); signOut(auth); }; });
    return;
  }
  STATE.uid = user.uid;
  STATE.me = { uid: user.uid, ...snap.data() };
  updateProfileUI();
  showScreen('screen-home');
  attachListeners();
  setupFCM();
  saveAccountToLocal(user.uid);
}
function saveAccountToLocal(uid) {
  if (!STATE.me) return;
  try {
    const accounts = JSON.parse(localStorage.getItem('chatgo_accounts') || '[]');
    const username = STATE.me.username;
    const filtered = accounts.filter(a => a.username !== username);
    filtered.unshift({ uid, username, displayName: STATE.me.displayName, photoURL: STATE.me.photoURL || '' });
    localStorage.setItem('chatgo_accounts', JSON.stringify(filtered.slice(0, 2)));
  } catch(e){}
}
onAuthStateChanged(auth, async user => {
  detachListeners();
  if (!user) { STATE.uid = null; STATE.me = null; showScreen('screen-auth'); return; }
  STATE.uid = user.uid;
  await loadProfileAndShow(user);
});
function updateProfileUI() {
  const me = STATE.me; if (!me) return;
  const tick = me.isVerified ? BLUE_TICK_SVG : '';
  if ($('#topbar-name')) $('#topbar-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-name')) $('#me-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-username')) $('#me-username').textContent = '@' + me.username;
  if ($('#me-bio')) $('#me-bio').textContent = me.bio || 'Belum ada bio';
  if ($('#me-alias')) $('#me-alias').textContent = '@' + me.username;
  setAvatarEl($('#my-status-avatar'), me.displayName, me.photoURL);
  setAvatarEl($('#me-avatar'), me.displayName, me.photoURL, 'lg');
  if($('#priv-who')) $('#priv-who').value = me.privacy?.whoCanMessage || 'everyone';
  if($('#toggle-dark-mode')) $('#toggle-dark-mode').checked = document.documentElement.classList.contains('dark');
}
function detachListeners() {
  ['unsubChats','unsubStatuses','unsubMsgs','unsubTyping'].forEach(k => { if (STATE[k]) { try { STATE[k](); } catch(e){} STATE[k] = null; } });
}
function attachListeners() { detachListeners(); listenChats(); listenStatuses(); }

function listenChats() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', STATE.uid));
  STATE.unsubChats = onSnapshot(q, snap => {
    const all = [];
    let needsUnhide = [];
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (STATE.me.hiddenChats && STATE.me.hiddenChats.includes(c.id)) {
        if (c.lastMessage && c.lastMessage.senderId && c.lastMessage.senderId !== STATE.uid) needsUnhide.push(c.id);
      }
      all.push(c);
    });
    if (needsUnhide.length > 0) {
      STATE.me.hiddenChats = STATE.me.hiddenChats.filter(id => !needsUnhide.includes(id));
      updateDoc(doc(db, 'users', STATE.uid), { hiddenChats: arrayRemove(...needsUnhide) }).catch(()=>{});
    }
    STATE.chats = all;
    STATE.chats.sort((a, b) => {
      if (a.type === 'self') return -1;
      if (b.type === 'self') return 1;
      return (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0);
    });
    renderChats();
  });
}

/* SELECT MODE */
$('#btn-select-mode').addEventListener('click', () => {
  STATE.isSelectMode = !STATE.isSelectMode;
  STATE.selectedChats.clear();
  $('#search-container').classList.toggle('hidden', STATE.isSelectMode);
  $('#select-container').classList.toggle('hidden', !STATE.isSelectMode);
  $('.bottom-nav').classList.toggle('hidden', STATE.isSelectMode);
  $('#fab').classList.toggle('hidden', STATE.isSelectMode);
  $('#btn-select-mode').classList.toggle('ghost-light', !STATE.isSelectMode);
  $('#btn-select-mode').classList.toggle('active', STATE.isSelectMode);
  $('#list-chats').classList.toggle('select-mode-active', STATE.isSelectMode);
  renderChats();
});
$('#btn-cancel-select').addEventListener('click', () => $('#btn-select-mode').click());
$('#btn-select-all').addEventListener('click', () => {
  const visibleChats = STATE.chats.filter(c => !STATE.me.hiddenChats?.includes(c.id));
  if (STATE.selectedChats.size === visibleChats.length) STATE.selectedChats.clear();
  else visibleChats.forEach(c => STATE.selectedChats.add(c.id));
  renderChats();
});
$('#btn-delete-selected').addEventListener('click', async () => {
  if (STATE.selectedChats.size === 0) { toast('Pilih chat dulu'); return; }
  if (!confirm(`Hapus ${STATE.selectedChats.size} chat dari halaman utama?`)) return;
  try {
    const arr = Array.from(STATE.selectedChats);
    await updateDoc(doc(db, 'users', STATE.uid), { hiddenChats: arrayUnion(...arr) });
    STATE.me.hiddenChats = [...(STATE.me.hiddenChats || []), ...arr];
    toast('Chat dihapus dari halaman utama');
    $('#btn-select-mode').click();
    renderChats();
  } catch (e) { toast('Gagal: ' + e.message); }
});

function chatDisplayName(chat) {
  if (chat.type === 'self') return 'Catatan Pribadi';
  if (chat.type === 'group') return chat.name || 'Grup';
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberNames?.[otherUid] || chat.name || 'Chat';
}
function getChatTick(chat) {
  if (chat.type === 'group' && chat.isVerified) return BLUE_TICK_SVG;
  if (chat.type === 'direct') {
    const otherUid = (chat.members || []).find(u => u !== STATE.uid);
    if (chat.memberVerified && chat.memberVerified[otherUid]) return BLUE_TICK_SVG;
  }
  return '';
}
function chatDisplayPhoto(chat) {
  if (chat.type === 'self') return null;
  if (chat.type === 'group') return chat.photoURL || null;
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberPhotos?.[otherUid] || null;
}

function renderChats() {
  const list = $('#list-chats');
  const filter = ($('#search-input').value || '').toLowerCase().trim();
  const items = STATE.chats.filter(c => {
    const isHidden = STATE.me.hiddenChats?.includes(c.id);
    const matchesSearch = !filter || chatDisplayName(c).toLowerCase().includes(filter);
    if (filter) return matchesSearch;
    return !isHidden;
  });
  if (!items.length) { list.innerHTML = `<div class="empty">Belum ada chat.</div>`; return; }
  list.innerHTML = items.map(chat => {
    const name = chatDisplayName(chat);
    const photo = chatDisplayPhoto(chat);
    const tick = getChatTick(chat);
    const last = chat.lastMessage;
    const isPending = chat.pendingFor && chat.pendingFor.includes(STATE.uid);
    let preview = last ? (last.senderId === STATE.uid ? 'Kamu: ' : '') + (last.text || '📎 Media') : 'Belum ada pesan';
    if (isPending) preview = '<span style="color:var(--danger);font-weight:bold;">Permintaan pesan masuk</span>';
    const time = last?.createdAt ? fmtTime(last.createdAt) : (chat.updatedAt ? fmtTime(chat.updatedAt) : '');
    const unread = (chat.unread || {})[STATE.uid] || 0;
    const icons = [chat.type === 'self' ? '📝' : '', chat.type === 'group' ? '👥' : ''].filter(Boolean).map(i => `<span class="tag">${i}</span>`).join('');
    const isSelected = STATE.selectedChats.has(chat.id) ? 'selected' : '';
    return `<div class="chat-item ${isSelected}" data-chat="${chat.id}">
      <div class="chat-checkbox"></div>
      ${avatarHTML(name, photo)}
      <div class="chat-item-body">
        <div class="chat-top">
          <div class="chat-name">${icons}<span class="truncate">${esc(name)}</span> ${tick}</div>
          <span class="chat-time">${esc(time)}</span>
        </div>
        <div class="chat-preview">
          <span class="truncate">${preview}</span>
          ${(!STATE.isSelectMode && unread && !isPending) ? `<em class="badge">${unread}</em>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

$('#list-chats').addEventListener('click', e => {
  const item = e.target.closest('[data-chat]'); if (!item) return;
  const chatId = item.dataset.chat;
  if (STATE.isSelectMode) {
    if (STATE.selectedChats.has(chatId)) STATE.selectedChats.delete(chatId);
    else STATE.selectedChats.add(chatId);
    renderChats();
  } else openChat(chatId);
});

$('#search-input').addEventListener('input', () => renderChats());

/* STATUS LIST */
function listenStatuses() {
  const q = query(collection(db, 'status'), orderBy('createdAt', 'desc'), limit(50));
  STATE.unsubStatuses = onSnapshot(q, snap => {
    const now = Date.now();
    const contactUids = STATE.chats.filter(c => c.type === 'direct' && (!c.pendingFor || c.pendingFor.length === 0)).map(c => c.members.find(u => u !== STATE.uid));
    STATE.statuses = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(s => s.expiresAt?.toMillis?.() > now)
      .filter(s => s.userId === STATE.uid || contactUids.includes(s.userId));
    renderStatuses();
  });
}
function renderStatuses() {
  const list = $('#list-status');
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid);
  const otherStatuses = STATE.statuses.filter(s => s.userId !== STATE.uid);
  const myCard = $('#status-add');
  if (myStatuses.length > 0) {
    myCard.innerHTML = `<div class="status-ring" style="padding:2px;background:linear-gradient(140deg,#13c08d,#0a7c66);border-radius:50%;box-shadow:none">${avatarHTML(myStatuses[0].userName, myStatuses[0].userPhoto, '', 'my-status-avatar')}</div><div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">${myStatuses.length} pembaruan</p></div><span class="plus-dot">+</span>`;
  } else {
    myCard.innerHTML = `${avatarHTML(STATE.me.displayName, STATE.me.photoURL, '', 'my-status-avatar')}<div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">Ketuk untuk menambah</p></div><span class="plus-dot">+</span>`;
  }
  myCard.onclick = openMyStatusesModal;
  if (!otherStatuses.length) { list.innerHTML = `<div class="empty">Belum ada status dari kontakmu.</div>`; return; }
  const grouped = {};
  otherStatuses.forEach(s => { if (!grouped[s.userId]) grouped[s.userId] = []; grouped[s.userId].push(s); });
  const groupsArray = Object.values(grouped).map(g => { g.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0)); return g; }).sort((a, b) => ((b[b.length - 1].createdAt?.toMillis() || 0) - (a[a.length - 1].createdAt?.toMillis() || 0)));
  list.innerHTML = groupsArray.map(group => {
    const latest = group[group.length - 1];
    const hasUnviewed = group.some(s => !(s.viewers || []).includes(STATE.uid));
    const icon = latest.type === 'video' ? '🎥' : (latest.type === 'image' ? '📷' : '📝');
    return `<div class="status-item" data-userid="${latest.userId}"><div class="status-ring ${hasUnviewed ? '' : 'seen'}">${avatarHTML(latest.userName, latest.userPhoto)}</div><div class="status-info"><strong class="truncate">${esc(latest.userName)}</strong><span>${esc(fmtRel(latest.createdAt))}</span></div><span class="status-badge">${icon}</span></div>`;
  }).join('');
}

function openMyStatusesModal() {
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid).sort((a,b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
  showModal(`<div class="modal-header"><h3>Status Saya (${myStatuses.length})</h3></div><div class="modal-body"><button class="btn btn-primary" id="ms-add">+ Tambah Status Baru</button><div id="ms-list">${myStatuses.length ? myStatuses.map(s => {
    const label = s.type === 'video' ? '🎥 Video' : (s.type === 'image' ? '📷 Foto' : '📝 Teks');
    const likeCount = (s.likes || []).length;
    return `<div class="status-item" style="cursor:default"><div class="status-ring">${avatarHTML(s.userName, s.userPhoto)}</div><div class="status-info"><strong>${label}</strong><span>${esc(fmtRel(s.createdAt))}${likeCount ? ' • ❤️ ' + likeCount : ''}</span></div><button class="btn btn-soft sm" data-ms-view="${s.id}" style="padding:8px 12px;font-size:12px">Lihat</button><button class="btn btn-danger sm" data-ms-del="${s.id}" style="padding:8px 12px;font-size:12px">${SVG_TRASH}</button></div>`;
  }).join('') : '<p class="muted small center">Belum ada status.</p>'}</div></div><div class="modal-footer"><button class="btn btn-soft" id="ms-close">Tutup</button></div>`, root => {
    root.querySelector('#ms-close').onclick = closeModal;

  });
}

/* STATUS VIEWER */
function openStatusViewer(statuses) {
  STATE.currentStatusGroup = statuses;
  STATE.currentStatusIndex = 0;
  const wrap = document.createElement('div');
  wrap.className = 'status-viewer';
  wrap.id = 'status-viewer-overlay';
  const progressHTML = statuses.map((_, i) => `<div class="status-progress-segment"><div class="status-progress-fill" id="sp-fill-${i}"></div></div>`).join('');
  wrap.innerHTML = `
    <div class="status-progress-container" id="sp-container">${progressHTML}</div>
    <div class="sv-header" id="sv-header"></div>
    <div class="sv-body" id="sv-body"></div>
    <div class="status-bottom-area" id="status-bottom-area"></div>
    <div class="viewers-overlay" id="viewers-overlay">
      <div class="viewers-sheet">
        <div class="viewers-header">
          <span id="viewers-title">Dilihat oleh</span>
          <button class="icon-btn" id="viewers-close" style="color:#fff">
            <svg class="svg-icon-outline" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="viewers-list" id="viewers-list"></div>
      </div>
    </div>
    <div class="status-nav-zone left" id="sp-prev"></div>
    <div class="status-nav-zone right" id="sp-next"></div>
  `;
  document.body.appendChild(wrap);

  const loadStatus = (index) => {
    clearTimeout(STATE.statusTimer);
    if (index >= STATE.currentStatusGroup.length) { closeViewer(); return; }
    const s = STATE.currentStatusGroup[index];
    const isMine = s.userId === STATE.uid;

    STATE.currentStatusGroup.forEach((_, i) => {
      const fill = document.getElementById(`sp-fill-${i}`);
      if (!fill) return;
      fill.style.transition = 'none';
      fill.style.width = i < index ? '100%' : '0%';
    });

    const header = document.getElementById('sv-header');
    header.innerHTML = `
      ${avatarHTML(s.userName, s.userPhoto, 'sm')}
      <div class="info"><strong>${esc(s.userName)}</strong><small>${esc(fmtRel(s.createdAt))}</small></div>
      ${isMine ? `<button class="icon-btn ghost-light" id="sv-delete" style="margin-right:10px">${SVG_TRASH}</button>` : ''}
      <button class="icon-btn ghost-light" id="sv-close"><svg class="svg-icon-outline" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    `;
    header.querySelector('#sv-close').onclick = closeViewer;
    if (isMine) header.querySelector('#sv-delete').onclick = async () => { if (confirm('Hapus status ini?')) { await deleteDoc(doc(db, 'status', s.id)); closeViewer(); } };

    const body = document.getElementById('sv-body');
    let mediaHTML = `<div class="sv-text-content"><p>${esc(s.content)}</p></div>`;
    if (s.type === 'image' && s.photoURL) mediaHTML = `<img src="${esc(s.photoURL)}">`;
    else if (s.type === 'video' && s.photoURL) mediaHTML = `<video id="sv-video" src="${esc(s.photoURL)}" autoplay playsinline></video>`;
    body.innerHTML = mediaHTML;

    const bottomArea = document.getElementById('status-bottom-area');
    let actionHTML = '';
    if (isMine) {
      actionHTML = `<div class="status-action-bar"><button class="btn-viewers" id="sv-viewers-btn"><svg class="svg-icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>${(s.viewers||[]).length}</button></div>`;
    } else {
      const isLiked = (s.likes || []).includes(STATE.uid);
      actionHTML = `<div class="status-action-bar"><button class="btn-reply" id="sv-reply-btn">Balas...</button><button class="status-like-btn ${isLiked ? 'liked' : ''}" id="sv-like-btn"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button></div>`;
    }
    let captionHTML = '';
    if (s.type !== 'text' && s.content) captionHTML = `<div class="status-caption">${esc(s.content)}</div>`;
    bottomArea.innerHTML = actionHTML + captionHTML;

    if (isMine) {
      document.getElementById('sv-viewers-btn').onclick = async (e) => {
        e.stopPropagation();
        clearTimeout(STATE.statusTimer);
        const pauseVideo = document.getElementById('sv-video');
        if (pauseVideo) pauseVideo.pause();
        const curFill = document.getElementById(`sp-fill-${index}`);
        if (curFill) { const pct = (parseFloat(getComputedStyle(curFill).width) / curFill.parentElement.offsetWidth) * 100 || 0; curFill.style.transition = 'none'; curFill.style.width = pct + '%'; }
        const viewersList = document.getElementById('viewers-list');
        const viewersTitle = document.getElementById('viewers-title');
        const overlay = document.getElementById('viewers-overlay');
        viewersList.innerHTML = `<p style="padding:20px;text-align:center;color:#aaa;">Memuat...</p>`;
        overlay.classList.add('show');
        const resumeProgress = () => {
          const curStatus = STATE.currentStatusGroup[index];
          const resumeVideo = document.getElementById('sv-video');
          if (resumeVideo && curStatus && curStatus.type === 'video') resumeVideo.play().catch(()=>{});
          else {
            const f = document.getElementById(`sp-fill-${index}`);
            if (f) { const curPct = parseFloat(f.style.width) || 0; const remaining = 4 * (100 - curPct) / 100; f.style.transition = `width ${remaining}s linear`; f.style.width = '100%'; clearTimeout(STATE.statusTimer); STATE.statusTimer = setTimeout(() => nextStatus(), remaining * 1000); }
          }
        };
        const closeViewersOverlay = () => { overlay.classList.remove('show'); resumeProgress(); };
        overlay.onclick = (ev) => { if (ev.target === overlay) closeViewersOverlay(); };
        document.getElementById('viewers-close').onclick = closeViewersOverlay;
        let fresh = s;
        try { const freshSnap = await getDoc(doc(db, 'status', s.id)); if (freshSnap.exists()) fresh = freshSnap.data(); } catch (err) {}
        const viewerUids = fresh.viewers || [];
        const likeUids = fresh.likes || [];
        if (viewerUids.length === 0) { viewersTitle.textContent = 'Dilihat oleh 0'; viewersList.innerHTML = `<p style="padding:20px;text-align:center;color:#aaa;">Belum ada tayangan</p>`; return; }
        const viewers = [];
        for (const uid of viewerUids) { try { const uSnap = await getDoc(doc(db, 'users', uid)); if (uSnap.exists()) viewers.push({ uid, ...uSnap.data() }); } catch (err) {} }
        viewers.sort((a, b) => ((likeUids.includes(b.uid) ? 1 : 0) - (likeUids.includes(a.uid) ? 1 : 0)));
        viewersTitle.textContent = `Dilihat oleh ${viewers.length}`;
        viewersList.innerHTML = viewers.map(v => `<div class="viewer-item" data-viewer-uid="${v.uid}">${avatarHTML(v.displayName, v.photoURL, 'sm')}<div class="viewer-info"><strong>${esc(v.displayName)}</strong><span>@${esc(v.username)}</span></div>${likeUids.includes(v.uid) ? '<svg class="viewer-like-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' : ''}</div>`).join('');
        viewersList.querySelectorAll('.viewer-item').forEach(el => { el.onclick = () => { overlay.classList.remove('show'); closeViewer(); startChatWith(el.dataset.viewerUid); }; });
      };
    } else {
      document.getElementById('sv-reply-btn').onclick = async (e) => { e.stopPropagation(); closeViewer(); await startChatWith(s.userId, { text: s.content || '📷 Media', senderName: s.userName }); };
      document.getElementById('sv-like-btn').onclick = async (e) => {
        e.stopPropagation();
        const btn = e.currentTarget;
        const isCurrentlyLiked = btn.classList.contains('liked');
        try {
          if (isCurrentlyLiked) { await updateDoc(doc(db, 'status', s.id), { likes: arrayRemove(STATE.uid) }); btn.classList.remove('liked'); s.likes = (s.likes || []).filter(u => u !== STATE.uid); }
          else { await updateDoc(doc(db, 'status', s.id), { likes: arrayUnion(STATE.uid) }); btn.classList.add('liked'); s.likes = [...(s.likes || []), STATE.uid]; }
        } catch (err) { toast('Gagal: ' + err.message); }
      };
    }
    if (!isMine && !(s.viewers || []).includes(STATE.uid)) updateDoc(doc(db, 'status', s.id), { viewers: arrayUnion(STATE.uid) }).catch(() => {});
    const fill = document.getElementById(`sp-fill-${index}`);
    const video = document.getElementById('sv-video');
    if (s.type === 'video' && video) {
      video.onloadedmetadata = () => { fill.style.transition = 'none'; fill.style.width = '0%'; video.play().catch(() => {}); video.ontimeupdate = () => { if (!video.duration) return; fill.style.width = (video.currentTime / video.duration) * 100 + '%'; }; video.onended = () => nextStatus(); };
    } else {
      fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth;
      fill.style.transition = 'width 4s linear'; fill.style.width = '100%';
      STATE.statusTimer = setTimeout(() => nextStatus(), 4000);
    }
  };
  const nextStatus = () => { const v = document.getElementById('sv-video'); if (v) { v.pause(); v.ontimeupdate = null; v.onended = null; } STATE.currentStatusIndex++; loadStatus(STATE.currentStatusIndex); };
  const prevStatus = () => { const v = document.getElementById('sv-video'); if (v) { v.pause(); v.ontimeupdate = null; v.onended = null; } if (STATE.currentStatusIndex > 0) { STATE.currentStatusIndex--; loadStatus(STATE.currentStatusIndex); } else loadStatus(0); };
  const closeViewer = () => { clearTimeout(STATE.statusTimer); const v = document.getElementById('sv-video'); if (v) { v.pause(); v.ontimeupdate = null; v.onended = null; } wrap.remove(); };
  document.getElementById('sp-prev').onclick = prevStatus;
  document.getElementById('sp-next').onclick = nextStatus;
  loadStatus(0);
}

function openNewStatusModal() {
  showModal(`<div class="modal-header"><h3>Buat Status</h3></div><div class="modal-body"><label class="field"><span>Status teks (opsional)</span><div class="input-wrap"><input id="status-text" type="text" maxlength="120" placeholder="Apa yang kamu pikirkan?"></div></label><p class="muted small">Atau unggah Foto / Video (Maks 50MB).</p><button type="button" class="btn btn-soft" id="status-photo-btn">📷 / 🎥 Pilih Media</button></div><div class="modal-footer"><button class="btn btn-soft" id="status-cancel">Batal</button><button class="btn btn-primary" id="status-save">Bagikan</button></div>`, root => {
    let photoFile = null;
    root.querySelector('#status-cancel').onclick = closeModal;
    root.querySelector('#status-photo-btn').onclick = () => {
      const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*,video/*'; fi.style.display='none'; document.body.appendChild(fi);
      fi.onchange = e => { photoFile = e.target.files?.[0]; if(photoFile){ if(photoFile.size > 52428800) { toast('Ukuran maksimal 50MB'); photoFile=null; } else { root.querySelector('#status-photo-btn').textContent='📎 '+photoFile.name.substring(0, 15)+'...'; } } document.body.removeChild(fi); };
      fi.click();
    };
    root.querySelector('#status-save').onclick = async () => {
      const text = root.querySelector('#status-text').value.trim();
      if(!text && !photoFile){toast('Isi teks atau pilih media');return;}
      const btn = root.querySelector('#status-save'); btn.disabled=true; btn.textContent='Memproses…';
      try {
        let url=''; let type = 'text';
        if(photoFile) { type = photoFile.type.startsWith('video/') ? 'video' : 'image'; toast('Mengunggah media…'); url = await uploadToCloudinary(photoFile); }
        await addDoc(collection(db,'status'),{ userId:STATE.uid, userName:STATE.me.displayName, userPhoto:STATE.me.photoURL||'', type: type, content:text, photoURL:url, viewers:[], likes:[], createdAt:serverTimestamp(), expiresAt:Timestamp.fromMillis(Date.now()+86400000) });
        toast('Status dibagikan'); closeModal();
      } catch(e){ toast('Gagal: '+e.message); btn.disabled=false; btn.textContent='Bagikan'; }
    };
  });
}

$('#chat-back').addEventListener('click', () => {

  if(STATE.unsubTyping){STATE.unsubTyping();STATE.unsubTyping=null;}

$('#chat-header').addEventListener('click', (e) => {
  if (e.target.closest('#chat-back') || e.target.closest('#chat-menu')) return;

async function openChat(chatId, replyContext = null) {
  const snap = await getDoc(doc(db, 'chats', chatId));
  if (!snap.exists()) return;
  const data = snap.data();
  if (data.isBanned) { toast('Chat diblokir admin.'); return; }
  if (data.pins && data.pins[STATE.uid]) {
    showModal(`<div class="modal-header"><h3>Chat Terkunci ${SVG_LOCK}</h3></div><div class="modal-body"><label class="field"><span>PIN</span><div class="input-wrap"><input id="unlock-pin" type="password" maxlength="6"></div></label></div><div class="modal-footer"><button class="btn btn-soft" id="unlock-cancel">Batal</button><button class="btn btn-primary" id="unlock-btn">Buka</button></div>`, r => {
      r.querySelector('#unlock-cancel').onclick = closeModal;
      r.querySelector('#unlock-btn').onclick = () => { if(r.querySelector('#unlock-pin').value === data.pins[STATE.uid]) { closeModal(); proceedOpenChat(chatId, data, replyContext); } else toast('PIN salah'); };
    }); return;
  }
  proceedOpenChat(chatId, data, replyContext);
}

function proceedOpenChat(chatId, chat, replyContext = null) {
  if (STATE.me.hiddenChats && STATE.me.hiddenChats.includes(chatId)) {
    STATE.me.hiddenChats = STATE.me.hiddenChats.filter(id => id !== chatId);
    updateDoc(doc(db, 'users', STATE.uid), { hiddenChats: arrayRemove(chatId) }).catch(()=>{});
    renderChats();
  }
  STATE.currentChat = { id: chatId, ...chat }; 
  STATE.replyTo = replyContext; STATE.timerSec = 0; 
  if (replyContext) {
    $('#reply-name').textContent = replyContext.senderName;
    $('#reply-text').textContent = replyContext.text;
    $('#reply-bar').classList.remove('hidden');
  } else hideReplyBar();
  const name = chatDisplayName(chat); const photo = chatDisplayPhoto(chat); const tick = getChatTick(chat);
  $('#chat-name').innerHTML = esc(name) + tick;
  $('#chat-sub').textContent = chat.type === 'self' ? 'Catatan pribadi' : (chat.type === 'group' ? (chat.members?.length || 0) + ' anggota' : '@' + (chat.memberUsernames?.[chat.members.find(u => u !== STATE.uid)] || '—'));
  setAvatarEl($('#chat-avatar'), name, photo, 'sm');
  const isPending = chat.pendingFor && chat.pendingFor.includes(STATE.uid);
  if (isPending) { $('#stranger-bar').classList.remove('hidden'); $('#composer').classList.add('hidden'); }
  else { $('#stranger-bar').classList.add('hidden'); $('#composer').classList.remove('hidden'); }
  if ((chat.unread || {})[STATE.uid]) updateDoc(doc(db, 'chats', chatId), { ['unread.'+STATE.uid]: 0 });
  showScreen('screen-chat');
  if (STATE.unsubMsgs) STATE.unsubMsgs();
  if (STATE.unsubTyping) STATE.unsubTyping();
  listenMessages(chatId);
  listenTyping(chatId);
  if (replyContext) setTimeout(() => $('#chat-input').focus(), 300);
}

$('#btn-stranger-accept').addEventListener('click', async () => {
  if (!STATE.currentChat) return;
  await updateDoc(doc(db, 'chats', STATE.currentChat.id), { pendingFor: arrayRemove(STATE.uid) });
  STATE.currentChat.pendingFor = [];
  $('#stranger-bar').classList.add('hidden');
  $('#composer').classList.remove('hidden');
  toast('Pesan diterima');
});
$('#btn-stranger-block').addEventListener('click', async () => {
  if (!STATE.currentChat) return;
  const otherUid = (STATE.currentChat.members || []).find(u => u !== STATE.uid);
  await updateDoc(doc(db, 'users', STATE.uid), { blocked: arrayUnion(otherUid) });
  await deleteDoc(doc(db, 'chats', STATE.currentChat.id));
  toast('Pesan diblokir'); $('#chat-back').click();
});

function listenTyping(chatId) {
  const q = collection(db, 'chats', chatId, 'typing');
  STATE.unsubTyping = onSnapshot(q, snap => {
    const now = Date.now();
    let isTyping = false; let typingName = '';
    snap.forEach(d => {
      if (d.id !== STATE.uid) {
        const data = d.data();
        const time = data.timestamp?.toMillis ? data.timestamp.toMillis() : Date.now();
        if (now - time < 3000) { isTyping = true; typingName = data.name; }
      }
    });
    const exist = $('#typing-ui');
    if (isTyping) {
      const text = STATE.currentChat.type === 'group' ? `${esc(typingName)} sedang mengetik...` : 'sedang mengetik...';
      if (exist) exist.querySelector('span').textContent = text;
      else {
        const div = document.createElement('div');
        div.id = 'typing-ui';
        div.className = 'typing-indicator';
        div.innerHTML = `<span>${text}</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
        $('#chat-body').appendChild(div);
        $('#chat-body').scrollTop = $('#chat-body').scrollHeight;
      }
    } else if (exist) exist.remove();
  });
}

let typingTimer;
$('#chat-input').addEventListener('input', () => {
  if (!STATE.currentChat || STATE.currentChat.pendingFor?.includes(STATE.uid)) return;
  if (!STATE.isTypingActive) {
    STATE.isTypingActive = true;
    setDoc(doc(db, 'chats', STATE.currentChat.id, 'typing', STATE.uid), { name: STATE.me.displayName, timestamp: serverTimestamp() });
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(async () => {
    STATE.isTypingActive = false;
    if (STATE.currentChat) { try { await deleteDoc(doc(db, 'chats', STATE.currentChat.id, 'typing', STATE.uid)); } catch(e){} }
  }, 2000);
});

function listenMessages(chatId) {
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(300));
  STATE.unsubMsgs = onSnapshot(q, snap => {
    const now = Date.now();
    const newMsgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !(m.deletedFor||[]).includes(STATE.uid) && (!m.expiresAt || m.expiresAt.toMillis() > now));
    if (STATE.currentChat.messages && newMsgs.length > STATE.currentChat.messages.length) {
      const last = newMsgs[newMsgs.length - 1];
      if (last.senderId !== STATE.uid && last.type !== 'system') playMsgSound();
    }
    STATE.currentChat.messages = newMsgs;
    renderMessages();
  });
}

function renderMessages() {
  const chat = STATE.currentChat; if (!chat) return;
  const box = $('#chat-body'); const msgs = chat.messages || [];
  const encryptionNotice = `<div class="encryption-notice"><svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px;margin-right:5px;vertical-align:middle"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg> Pesan anda sudah terenkripsi secara end-to-end. Siapa pun tidak dapat melihat pesan Anda bahkan ChatGo Tidak dapat melihat nya kecuali pesan yang anda kirim mengandung kekarasan atau pelecehan lalu mereka melaporkan nya jika anda korban, harap laporkan itu kepada kami</div>`;
  if (!msgs.length) { box.innerHTML = encryptionNotice + `<div class="day-divider">Belum ada pesan</div>`; return; }
  box.innerHTML = encryptionNotice + msgs.map(m => {
    if (m.type === 'system') return `<div class="msg sys"><div class="bubble">${esc(m.text)}</div></div>`;
    const isOut = m.senderId === STATE.uid; const time = fmtTime(m.createdAt);
    const check = isOut ? (m.status === 'read' ? '<span class="checks read">✓✓</span>' : '<span class="checks">✓</span>') : '';
    const sender = (!isOut && chat.type === 'group') ? `<div class="sender-name">${esc(m.senderName || '')}</div>` : '';
    let body = m.isDeletedForEveryone ? '<span class="deleted">Dihapus</span>' : esc(m.text || '');
    if (m.type === 'image' && m.mediaUrl) body = `<img src="${esc(m.mediaUrl)}" class="chat-img" onclick="window.open('${esc(m.mediaUrl)}','_blank')">`;
    const reply = m.replyTo ? `<div class="reply-preview"><b>${esc(m.replyTo.senderName || '')}</b><br>${esc(m.replyTo.text || '')}</div>` : '';
    return `<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble">${sender}${reply}${body}<span class="meta">${esc(time)} ${check}</span></div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(text, type = 'text', mediaUrl = null) {
  const chat = STATE.currentChat; if (!chat || (!text.trim() && !mediaUrl)) return;
  if (text.length > 45536) { toast('Pesan terlalu panjang (maks 45.536 karakter)'); return; }
  if (chat.type === 'group' && chat.onlyAdminsCanChat) {
    const isAdmin = chat.createdBy === STATE.uid || (chat.admins || []).includes(STATE.uid);
    if (!isAdmin) { toast('Hanya Admin yang bisa chat di grup ini'); return; }
  }
  if (STATE.me.hiddenChats && STATE.me.hiddenChats.includes(chat.id)) {
    STATE.me.hiddenChats = STATE.me.hiddenChats.filter(id => id !== chat.id);
    updateDoc(doc(db, 'users', STATE.uid), { hiddenChats: arrayRemove(chat.id) }).catch(()=>{});
    renderChats();
  }
  const payload = {
    senderId: STATE.uid, senderName: STATE.me.displayName, text: text.trim(), type: type, status: 'sent',
    createdAt: serverTimestamp(), replyTo: STATE.replyTo ? { text: STATE.replyTo.text || '📎', senderName: STATE.replyTo.senderName } : null,
    timer: STATE.timerSec || 0, isDeletedForEveryone: false, deletedFor: []
  };
  if (mediaUrl) payload.mediaUrl = mediaUrl;
  if (STATE.timerSec) payload.expiresAt = Timestamp.fromMillis(Date.now() + STATE.timerSec * 1000);
  await addDoc(collection(db, 'chats', chat.id, 'messages'), payload);
  playMsgSound();
  const unread = {}; (chat.members || []).filter(u => u !== STATE.uid).forEach(u => unread['unread.'+u] = ((chat.unread||{})[u]||0)+1);
  await updateDoc(doc(db, 'chats', chat.id), { lastMessage: { text: type==='image'?'📷 Foto':payload.text, senderId: STATE.uid, senderName: STATE.me.displayName, createdAt: serverTimestamp() }, updatedAt: serverTimestamp(), ...unread });
  STATE.replyTo = null; STATE.timerSec = 0; hideReplyBar(); $('#chat-input').value = '';
}

/* START CHAT WITH USER */
async function startChatWith(otherUid, replyContext = null) {
  if (!otherUid || otherUid === STATE.uid) return;
  try {
    const userSnap = await getDoc(doc(db, 'users', otherUid));
    if (!userSnap.exists()) { toast('Pengguna tidak ditemukan'); return; }
    const otherUser = userSnap.data();
    const mySnap = await getDoc(doc(db, 'users', STATE.uid));
    const myData = mySnap.data();

    if ((myData.blocked || []).includes(otherUid)) { toast('Anda telah memblokir kontak ini'); return; }
    if ((otherUser.blocked || []).includes(STATE.uid)) { toast('Tidak dapat mengirim pesan'); return; }

    const q = query(collection(db, 'chats'), where('type', '==', 'direct'), where('members', 'array-contains', STATE.uid));
    const snap = await getDocs(q);
    let existing = null;
    snap.forEach(d => { const c = d.data(); if (c.members.includes(otherUid) && c.members.length === 2) existing = { id: d.id, ...c }; });
    if (existing) return openChat(existing.id, replyContext);

    const whoCan = otherUser.privacy?.whoCanMessage || 'everyone';
    if (whoCan === 'nobody') { toast('Pengguna menutup permintaan pesan'); return; }

    const newChat = {
      type: 'direct',
      members: [STATE.uid, otherUid],
      memberNames: { [STATE.uid]: myData.displayName, [otherUid]: otherUser.displayName },
      memberPhotos: { [STATE.uid]: myData.photoURL || '', [otherUid]: otherUser.photoURL || '' },
      memberUsernames: { [STATE.uid]: myData.username, [otherUid]: otherUser.username },
      memberVerified: { [otherUid]: !!otherUser.isVerified },
      lastMessage: { text: 'Mulai percakapan', senderId: STATE.uid, senderName: myData.displayName },
      updatedAt: serverTimestamp(), createdAt: serverTimestamp(),
      unread: {}, hiddenChats: []
    };
    if (whoCan === 'contacts') newChat.pendingFor = [otherUid];
    const ref = await addDoc(collection(db, 'chats'), newChat);
    openChat(ref.id, replyContext);
  } catch (e) { toast('Gagal memulai chat: ' + e.message); }
}

$('#chat-menu').addEventListener('click', (e) => { e.stopPropagation(); openChatMenu(); });

function openChatMenu() {
  const chat = STATE.currentChat; if (!chat) return;
  const isSelf  = chat.type === 'self';

  const backdrop = $('#chat-menu-backdrop');

  const icoGroup   = `<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`;
  const icoContact = `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
  const icoSearch  = `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
  const icoMedia   = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
  const icoBell    = `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
  const icoBellOff = `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  const icoBlock   = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`;
  const icoReport  = `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;

  let html = '';
  if (!isSelf) html += `<button class="cm-item" data-cm="info"><span class="ico">${isGroup ? icoGroup : icoContact}</span>${isGroup ? 'Info grup' : 'Info kontak'}</button>`;
  html += `<button class="cm-item" data-cm="search"><span class="ico">${icoSearch}</span>Cari</button>`;
  html += `<button class="cm-item" data-cm="media"><span class="ico">${icoMedia}</span>Media, tautan, dokumen</button>`;
  if (!isSelf) html += `<button class="cm-item" data-cm="mute"><span class="ico">${isMuted ? icoBell : icoBellOff}</span>${isMuted ? 'Bunyikan notifikasi' : 'Bisukan notifikasi'}</button>`;
  html += `<button class="cm-item" data-cm="clear"><span class="ico">${icoClear}</span>Bersihkan chat</button>`;
  if (!isSelf) {
    html += `<div class="cm-divider"></div>`;
    html += `<button class="cm-item danger" data-cm="block"><span class="ico">${icoBlock}</span>${isGroup ? 'Blokir grup' : 'Blokir ' + (chat.memberNames?.[otherUid] || 'kontak')}</button>`;
    html += `<button class="cm-item danger" data-cm="report"><span class="ico">${icoReport}</span>Laporkan</button>`;

function closeChatMenu() {
  const popup = $('#chat-menu-popup');
  const backdrop = $('#chat-menu-backdrop');
  if (!popup) return;
  popup.classList.remove('show');
  backdrop.classList.remove('show');
  setTimeout(() => { if (!popup.classList.contains('show')) popup.innerHTML = ''; }, 240);
}

async function handleChatMenuAction(action) {
  const chat = STATE.currentChat; if (!chat) return;
  switch (action) {
    case 'info': {
      if (chat.type === 'group') return openGroupSettings(chat.id);
      const otherUid = chat.members.find(u => u !== STATE.uid);
      if (!otherUid) return;
      try { const snap = await getDoc(doc(db, 'users', otherUid)); if (snap.exists()) showContactInfoModal(snap.data()); } catch (e) { toast('Gagal memuat info'); }
      return;
    }
    case 'search': return showChatSearchModal();
    case 'media':  return showChatMediaModal();
    case 'mute':   return toggleMuteChat(chat.id);
    case 'clear':  return clearChatMessages(chat.id);
    case 'block':  return blockChatContact(chat.id);
    case 'report': return showReportModal(chat.id);
  }
}

        <p class="muted small">@${esc(data.username)}</p>

      </div>

      </div>

async function toggleMuteChat(chatId) {
  try {
    const snap = await getDoc(doc(db, 'chats', chatId));
    const data = snap.data();
    const muted = (data.mutedBy || []).includes(STATE.uid);
    if (muted) { await updateDoc(doc(db, 'chats', chatId), { mutedBy: arrayRemove(STATE.uid) }); toast('Notifikasi dibunyikan'); }
    else { await updateDoc(doc(db, 'chats', chatId), { mutedBy: arrayUnion(STATE.uid) }); toast('Notifikasi dibisukan'); }
    if (STATE.currentChat) STATE.currentChat.mutedBy = muted ? (data.mutedBy || []).filter(u => u !== STATE.uid) : [...(data.mutedBy || []), STATE.uid];
  } catch (e) { toast('Gagal: ' + e.message); }
}

async function clearChatMessages(chatId) {
  if (!confirm('Hapus semua pesan di chat ini (untuk Anda)?')) return;
  try {
    const snap = await getDocs(collection(db, 'chats', chatId, 'messages'));
    if (snap.empty) { toast('Tidak ada pesan'); return; }
    const batch = writeBatch(db);
    snap.forEach(d => batch.update(d.ref, { deletedFor: arrayUnion(STATE.uid) }));
    await batch.commit();
    toast('Chat dibersihkan');
  } catch (e) { toast('Gagal: ' + e.message); }
}

async function blockChatContact(chatId) {
  const chat = STATE.currentChat;
  const otherUid = chat.members.find(u => u !== STATE.uid);
  if (!otherUid) return;
  if (!confirm('Blokir kontak ini? Anda tidak akan menerima pesan dari mereka.')) return;
  try {
    await updateDoc(doc(db, 'users', STATE.uid), { blocked: arrayUnion(otherUid) });
    STATE.me.blocked = [...(STATE.me.blocked || []), otherUid];
    toast('Kontak diblokir');
    $('#chat-back').click();
  } catch (e) { toast('Gagal: ' + e.message); }
}

function showReportModal(chatId) {
  showModal(`
    <div class="modal-header"><h3>Laporkan</h3></div>
    <div class="modal-body">
      <p class="muted small">Pilih alasan laporan Anda:</p>
      <select id="report-reason" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--input-bg);color:var(--text);font-weight:600">
        <option value="spam">Spam</option>
        <option value="harassment">Pelecehan</option>
        <option value="violence">Kekerasan</option>
        <option value="nudity">Konten dewasa</option>
        <option value="other">Lainnya</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-soft" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" id="report-submit">Laporkan</button>
    </div>
  `, root => {
    root.querySelector('#report-submit').onclick = async () => {
      const reason = root.querySelector('#report-reason').value;
      try {
        await addDoc(collection(db, 'reports'), { chatId, reporterId: STATE.uid, reason, createdAt: serverTimestamp(), status: 'pending' });
        toast('Laporan terkirim. Terima kasih.'); closeModal();
      } catch (e) { toast('Gagal: ' + e.message); }
    };
  });
}

function showChatSearchModal() {
  showModal(`
    <div class="modal-header"><h3>Cari Pesan</h3></div>
    <div class="modal-body" style="padding-top:12px">
      <div class="input-wrap"><input id="chat-search-input" placeholder="Cari dalam chat…" autocomplete="off"></div>
      <div id="chat-search-results" style="max-height:50vh;overflow-y:auto"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>
  `, root => {
    const input = root.querySelector('#chat-search-input');
    const results = root.querySelector('#chat-search-results');
    input.focus();
    const render = () => {
      const q = input.value.toLowerCase().trim();
      const msgs = (STATE.currentChat?.messages || []).filter(m => m.type !== 'system' && (!q || (m.text || '').toLowerCase().includes(q)));
      if (!msgs.length) { results.innerHTML = `<p class="muted small center" style="padding:16px">Tidak ada hasil</p>`; return; }
      results.innerHTML = msgs.slice(-50).reverse().map(m => `
        <div class="row" style="padding:10px 0;align-items:flex-start" data-search-mid="${m.id}">
          <div style="flex:1;min-width:0">
            <div class="small muted" style="font-size:11px">${m.senderId === STATE.uid ? 'Kamu' : esc(m.senderName || '')}</div>
            <div style="font-size:13.5px;margin-top:2px">${esc(m.text || '📎 Media')}</div>
          </div>
          <span class="small muted" style="font-size:11px;flex-shrink:0">${fmtTime(m.createdAt)}</span>
        </div>`).join('');
      results.querySelectorAll('[data-search-mid]').forEach(el => {
        el.onclick = () => {
          closeModal();
          const target = document.querySelector(`[data-mid="${el.dataset.searchMid}"]`);
          if (target) {
            target.scrollIntoView({ behavior:'smooth', block:'center' });
            target.style.transition = 'background .5s';
            target.style.background = 'rgba(18,184,134,0.18)';
            setTimeout(() => { target.style.background = ''; }, 1500);
          }
        };
      });
    };
    input.oninput = render;
    render();
  });
}

function showChatMediaModal() {
  const msgs = (STATE.currentChat?.messages || []).filter(m => m.type === 'image' && m.mediaUrl && !m.isDeletedForEveryone);
  showModal(`
    <div class="modal-header"><h3>Media (${msgs.length})</h3></div>
    <div class="modal-body">
      ${msgs.length ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">${msgs.map(m => `<img src="${esc(m.mediaUrl)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open('${esc(m.mediaUrl)}','_blank')">`).join('')}</div>` : `<p class="muted small center" style="padding:24px">Belum ada media dibagikan.</p>`}
    </div>
    <div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>
  `);
}

/* FAB & NEW CHAT PICKER */
$('#fab').addEventListener('click', () => showNewChatModal());

function showNewChatModal() {
  showModal(`
    <div class="modal-header"><h3>Mulai Chat Baru</h3></div>
    <div class="modal-body">
      <label class="field"><span>Cari username</span><div class="input-wrap"><span class="prefix">@</span><input id="nc-search" placeholder="username" autocomplete="off"></div></label>
      <div id="nc-results" style="max-height:50vh;overflow-y:auto"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>
  `, root => {
    const input = root.querySelector('#nc-search');
    const results = root.querySelector('#nc-results');
    input.focus();
    let debounceTimer;
    input.oninput = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const q = input.value.toLowerCase().trim();
        if (!q) { results.innerHTML = ''; return; }
        results.innerHTML = `<p class="muted small center" style="padding:12px">Mencari…</p>`;
        try {
          const snap = await getDoc(doc(db, 'usernames', q));
          if (!snap.exists()) { results.innerHTML = `<p class="muted small center" style="padding:12px">Tidak ditemukan</p>`; return; }
          const uid = snap.data().uid;
          if (uid === STATE.uid) { results.innerHTML = `<p class="muted small center" style="padding:12px">Itu akun kamu sendiri</p>`; return; }
          const uSnap = await getDoc(doc(db, 'users', uid));
          if (!uSnap.exists()) return;
          const u = uSnap.data();
          results.innerHTML = `<div class="search-result" data-start-chat="${uid}">${avatarHTML(u.displayName, u.photoURL, 'sm')}<div class="info"><strong>${esc(u.displayName)}${u.isVerified ? BLUE_TICK_SVG : ''}</strong><span>@${esc(u.username)}</span></div></div>`;
          results.querySelector('[data-start-chat]').onclick = () => { closeModal(); startChatWith(uid); };
        } catch (e) { results.innerHTML = `<p class="muted small center" style="padding:12px">Error: ${esc(e.message)}</p>`; }
      }, 350);
    };
  });
}

/* AUTH FORM HANDLERS */
$$('.seg-btn').forEach(b => {
  b.onclick = () => {
    $$('.seg-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const isLogin = b.dataset.auth === 'login';
    $('#form-login').classList.toggle('hidden', !isLogin);
    $('#form-register').classList.toggle('hidden', isLogin);
  };
});
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn-login'); btn.disabled = true; btn.textContent = 'Memproses…';
  try {
    await loginUser($('#login-user').value.trim(), $('#login-pass').value);
  } catch (err) { toast('Gagal masuk: ' + (err.code || err.message)); }
  btn.disabled = false; btn.textContent = 'Masuk';
});
$('#form-register').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn-register'); btn.disabled = true; btn.textContent = 'Memproses…';
  try {
    await registerUser($('#reg-name').value.trim(), $('#reg-user').value.trim(), $('#reg-pass').value);
  } catch (err) { toast('Gagal daftar: ' + (err.message || err.code)); }
  btn.disabled = false; btn.textContent = 'Buat Akun';
});
$('#reg-user').addEventListener('input', e => {
  const v = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
  e.target.value = v;
  const hint = $('#reg-hint');
  if (v.length === 0) { hint.textContent = '3-20 karakter (huruf kecil, angka, _)'; hint.className = 'hint'; }
  else if (v.length < 3) { hint.textContent = 'Terlalu pendek'; hint.className = 'hint err'; }
  else { hint.textContent = 'Format OK'; hint.className = 'hint ok'; }
});

/* PROFILE HANDLERS */
$('#toggle-dark-mode').addEventListener('change', e => setTheme(e.target.checked ? 'dark' : 'light'));
$('#priv-who').addEventListener('change', async e => {
  try { await updateDoc(doc(db, 'users', STATE.uid), { 'privacy.whoCanMessage': e.target.value }); STATE.me.privacy = { ...(STATE.me.privacy||{}), whoCanMessage: e.target.value }; toast('Privasi diperbarui'); }
  catch (err) { toast('Gagal: ' + err.message); }
});
$('#btn-enable-notif').addEventListener('click', () => setupFCM());
$('#btn-blocked-list').addEventListener('click', async () => {
  const blocked = STATE.me.blocked || [];
  showModal(`<div class="modal-header"><h3>Daftar Diblokir (${blocked.length})</h3></div><div class="modal-body">${blocked.length ? blocked.map(uid => `<div class="row" data-unblock="${uid}"><span>${esc(uid)}</span><button class="btn btn-soft sm" style="padding:6px 12px;font-size:12px">Buka Blokir</button></div>`).join('') : '<p class="muted small center">Tidak ada kontak diblokir</p>'}</div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>`, root => {
    root.querySelectorAll('[data-unblock]').forEach(row => {
      row.querySelector('button').onclick = async () => {
        try { await updateDoc(doc(db, 'users', STATE.uid), { blocked: arrayRemove(row.dataset.unblock) }); STATE.me.blocked = STATE.me.blocked.filter(u => u !== row.dataset.unblock); toast('Blokir dibuka'); closeModal(); }
        catch (e) { toast('Gagal: ' + e.message); }
      };
    });
  });
});
$('#btn-edit-profile').addEventListener('click', () => {
  showModal(`<div class="modal-header"><h3>Edit Profil</h3></div><div class="modal-body"><label class="field"><span>Nama</span><div class="input-wrap"><input id="ep-name" value="${esc(STATE.me.displayName)}" maxlength="40"></div></label><label class="field"><span>Bio</span><div class="input-wrap"><input id="ep-bio" value="${esc(STATE.me.bio||'')}" maxlength="160" placeholder="Bio singkat"></div></label></div><div class="modal-footer"><button class="btn btn-soft" id="ep-cancel">Batal</button><button class="btn btn-primary" id="ep-save">Simpan</button></div>`, root => {
    root.querySelector('#ep-cancel').onclick = closeModal;
    root.querySelector('#ep-save').onclick = async () => {
      const newName = root.querySelector('#ep-name').value.trim();
      const newBio = root.querySelector('#ep-bio').value.trim();
      if (!newName) return toast('Nama tidak boleh kosong');
      try { await updateDoc(doc(db, 'users', STATE.uid), { displayName: newName, bio: newBio }); STATE.me.displayName = newName; STATE.me.bio = newBio; updateProfileUI(); toast('Profil diperbarui'); closeModal(); }
      catch (e) { toast('Gagal: ' + e.message); }
    };
  });
});
$('#btn-change-photo').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', async e => {
  const file = e.target.files?.[0]; if (!file) return;
  if (file.size > 5242880) { toast('Maks 5MB'); e.target.value=''; return; }
  toast('Mengunggah foto…');
  try { const url = await uploadToCloudinary(file); await updateDoc(doc(db, 'users', STATE.uid), { photoURL: url }); STATE.me.photoURL = url; updateProfileUI(); toast('Foto diperbarui'); }
  catch (err) { toast('Gagal: ' + err.message); }
  e.target.value='';
});

/* TAB NAV */
$$('.nav-btn').forEach(b => {
  b.onclick = () => {
    $$('.nav-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const tab = b.dataset.tab;
    $$('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
    const fabVisible = tab === 'chats' && !STATE.isSelectMode;
    $('#fab').classList.toggle('hidden', !fabVisible);
  };
});

/* Timer button (quick delete timer) */
$('#btn-timer').addEventListener('click', () => {
  const opts = [{v:0,l:'Nonaktif'},{v:60,l:'1 menit'},{v:3600,l:'1 jam'},{v:86400,l:'24 jam'},{v:604800,l:'7 hari'}];
  showModal(`<div class="modal-header"><h3>Pesan Sementara</h3></div><div class="menu-list">${opts.map(o => `<button class="menu-item" data-timer="${o.v}">⏱ ${o.l}</button>`).join('')}</div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Batal</button></div>`, root => {
    root.querySelectorAll('[data-timer]').forEach(b => {
      b.onclick = () => { STATE.timerSec = parseInt(b.dataset.timer); toast(STATE.timerSec ? `Pesan akan hilang dalam ${b.textContent.trim().slice(2)}` : 'Timer dimatikan'); closeModal(); };
    });
  });
});

/* Attach & close any dropdown on outside click */
document.addEventListener('click', (e) => {
  if (!e.target.closest('#chat-menu-popup') && !e.target.closest('#chat-menu')) {
    if ($('#chat-menu-popup')?.classList.contains('show')) closeChatMenu();
  }
});

</script>
</body>
</html>
