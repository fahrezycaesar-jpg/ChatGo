<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0fa585">
<title>ChatGo</title>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>

<style>
:root{
  --primary:#0fa585;--primary-2:#12b886;--primary-dark:#0a7c66;
  --primary-soft:#e8f7f2;--bg:#eef2f5;--surface:#fff;
  --text:#12211d;--muted:#7c8c88;--line:#e6ecea;--danger:#e5484d;
  --nav-h:56px;--shadow-sm:0 2px 8px rgba(16,64,54,.06);
  --shadow-md:0 10px 26px rgba(16,64,54,.10);--shadow-lg:0 16px 34px rgba(10,124,102,.28);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  font-size:15px;color:var(--text);
  background:radial-gradient(circle at 15% 0%,#d6f2e9 0%,#eef2f5 45%,#e3ecf2 100%);
  display:flex;align-items:center;justify-content:center;
  height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
input,select,textarea{outline:none;}
img{display:block;max-width:100%;}
.hidden{display:none !important;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.muted{color:var(--muted);}.small{font-size:12px;}.center{text-align:center;}

.app-shell{
  position:relative;width:100%;max-width:480px;
  height:100vh;height:100dvh;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);min-height:0;}
.screen.active{display:flex;animation:screenIn .22s ease both;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#screen-chat.active{animation:slideIn .24s cubic-bezier(.22,.9,.3,1) both;}
@keyframes slideIn{from{opacity:.4;transform:translateX(18px);}to{opacity:1;transform:none;}}
@media (min-width:520px){
  body{padding:18px;}
  .app-shell{height:min(calc(100dvh - 36px),900px);border-radius:30px;border:1px solid rgba(255,255,255,.7);box-shadow:0 30px 80px rgba(9,45,38,.22);}
  .screen{border-radius:30px;overflow:hidden;}
}

.auth-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom));}
.auth-hero{background:linear-gradient(150deg,#13c08d 0%,#0fa585 45%,#0a7c66 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 42px) 26px 34px;border-radius:0 0 34px 34px;text-align:center;box-shadow:0 12px 28px rgba(10,124,102,.22);}
.brand-badge{width:60px;height:60px;margin:0 auto 16px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:.5px;backdrop-filter:blur(6px);}
.auth-hero h1{margin:0 0 8px;font-size:28px;letter-spacing:.3px;}
.auth-hero h1 span{color:#c7f6e5;}
.auth-hero p{margin:0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.88);}
.segmented{display:flex;gap:6px;background:#e2eae7;padding:5px;border-radius:16px;margin:20px 22px 0;}
.seg-btn{flex:1;padding:11px 8px;border-radius:12px;font-weight:700;font-size:14px;color:#5c6f6a;transition:all .18s ease;}
.seg-btn.active{background:#fff;color:var(--primary-dark);box-shadow:0 3px 10px rgba(10,60,50,.12);}
.auth-form{display:flex;flex-direction:column;gap:15px;padding:22px 22px 0;}
.field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:700;color:#43544f;}
.field>span{padding-left:2px;}
.input-wrap{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;transition:border-color .18s,box-shadow .18s;}
.input-wrap:focus-within{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(18,184,134,.14);}
.input-wrap input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:15px;}
.input-wrap .prefix{color:var(--muted);font-weight:800;}
.hint{margin:0;font-size:12px;color:var(--muted);padding-left:2px;}
.hint.ok{color:var(--primary-dark);font-weight:700;}
.hint.err{color:var(--danger);font-weight:700;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:15px;font-weight:800;font-size:15px;transition:transform .12s ease,box-shadow .18s ease,background .18s;border:none;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));color:#fff;box-shadow:0 12px 24px rgba(10,124,102,.28);}
.btn-soft{background:var(--primary-soft);color:var(--primary-dark);box-shadow:none;}
.btn-danger{background:#fdecec;color:var(--danger);}
.btn.sm{width:auto;padding:11px 18px;font-size:13.5px;border-radius:12px;}
.auth-note{margin:0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;}

.topbar{position:relative;z-index:6;background:linear-gradient(150deg,#13c08d 0%,#0fa585 50%,#0a7c66 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 18px;border-radius:0 0 26px 26px;box-shadow:0 8px 22px rgba(10,80,66,.20);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar-hello{margin:0 0 3px;font-size:12px;color:rgba(255,255,255,.82);}
.topbar-title{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:17px;color:#4b5f5a;transition:background .16s,transform .12s;flex-shrink:0;}
.icon-btn:active{transform:scale(.94);}
.ghost-light{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);}
.search-wrap{display:flex;align-items:center;gap:10px;margin-top:15px;padding:0 14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.26);border-radius:15px;backdrop-filter:blur(6px);}
.search-wrap .search-ico{font-size:14px;opacity:.9;}
.search-wrap input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:14px;color:#fff;}
.search-wrap input::placeholder{color:rgba(255,255,255,.78);}

.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px calc(var(--nav-h) + 84px);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadeUp .2s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-title{margin:6px 4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#8b9a96;}
.section-title:not(:first-child){margin-top:22px;}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;background:#fff;border:1px dashed var(--line);border-radius:18px;}

.avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px;background:linear-gradient(140deg,var(--a,#12b886),var(--b,#0a7c66));box-shadow:0 4px 12px rgba(10,90,75,.18);user-select:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:38px;height:38px;font-size:13px;}
.avatar.lg{width:82px;height:82px;font-size:28px;margin:0 auto;}
.badge{min-width:21px;height:21px;padding:0 6px;display:inline-grid;place-items:center;border-radius:99px;background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));color:#fff;font-size:11px;font-weight:800;font-style:normal;flex-shrink:0;box-shadow:0 3px 8px rgba(10,124,102,.28);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);}
.tag{font-size:11px;line-height:1;}

/* CSS untuk Select Mode Chat */
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s ease,background .16s,box-shadow .16s;}
.chat-item:active{transform:scale(.988);background:#fbfdfc;box-shadow:0 1px 4px rgba(16,64,54,.06);}
.chat-item.selected {border-color: var(--primary); background: var(--primary-soft);}
.chat-checkbox { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ccc; display: none; flex-shrink: 0; }
.select-mode-active .chat-checkbox { display: block; }
.chat-item.selected .chat-checkbox { background: var(--primary); border-color: var(--primary); position:relative;}
.chat-item.selected .chat-checkbox::after { content:"✓"; position:absolute; color:#fff; font-size:12px; font-weight:bold; top:-2px; left:4px;}
.chat-item-body{flex:1;min-width:0;}
.chat-top{display:flex;align-items:baseline;gap:8px;}
.chat-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;}
.chat-time{font-size:11px;color:var(--muted);flex-shrink:0;font-weight:600;}
.chat-preview{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13px;color:var(--muted);}
.chat-preview>span{flex:1;min-width:0;}

.status-add{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;transition:background .16s;}
.status-add:active{background:#fbfdfc;}
.status-add strong{display:block;font-size:14.5px;}
.status-add p{margin:2px 0 0;font-size:12px;}
.plus-dot{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);font-size:17px;font-weight:800;}
.status-item{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s ease;}
.status-item:active{transform:scale(.988);}
.status-ring{padding:2.5px;border-radius:50%;background:linear-gradient(140deg,#13c08d,#0a7c66);flex-shrink:0;}
.status-ring.seen{background:#cfdad7;}
.status-ring .avatar{box-shadow:none;}
.status-info{flex:1;min-width:0;}
.status-info strong{display:block;font-size:14.5px;font-weight:700;}
.status-info span{display:block;margin-top:2px;font-size:12px;color:var(--muted);}
.status-badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary-dark);flex-shrink:0;}

.req-item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.req-head{display:flex;align-items:center;gap:12px;}
.req-head-info{flex:1;min-width:0;}
.req-head-info strong{display:block;font-size:15px;font-weight:700;}
.req-head-info span{display:block;margin-top:1px;font-size:12px;color:var(--primary-dark);font-weight:600;}
.req-msg{margin:12px 0 14px;padding:11px 13px;background:#f4f8f7;border-radius:13px;font-size:13.5px;line-height:1.5;color:#3d4f4a;}
.req-actions{display:flex;gap:10px;}
.req-actions .btn{flex:1;padding:12px 10px;font-size:13.5px;border-radius:13px;}
.btn-accept{background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));color:#fff;box-shadow:0 8px 18px rgba(10,124,102,.24);}
.btn-reject{background:#fdecec;color:var(--danger);}

.profile-card{padding:22px 18px 20px;text-align:center;background:linear-gradient(180deg,#ffffff,#f8fdfb);}
.profile-card h3{margin:14px 0 2px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;}
.profile-card .uname{margin:0;font-size:13px;color:var(--primary-dark);font-weight:700;}
.profile-card .bio{margin:9px 0 0;font-size:13px;color:var(--muted);line-height:1.55;}
.alias-chip{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;background:#f1f7f5;border:1px dashed #cfe3dd;font-size:12px;color:#4b5f5a;}
.alias-chip b{color:var(--primary-dark);}
.profile-actions{display:flex;gap:10px;margin-top:16px;}
.profile-actions .btn{flex:1;}
.list-card{padding:2px 14px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 2px;font-size:13.8px;font-weight:600;text-align:left;border-bottom:1px solid #f1f6f4;background:transparent;transition:opacity .15s;color:var(--text);}
.list-card .row:last-child{border-bottom:0;}
.row:active{opacity:.65;}
.row .row-ico{margin-right:8px;}
.row .chev{color:#bccbc7;font-size:16px;font-weight:700;}
.row.danger{color:var(--danger);}
.row select{border:0;background:#f1f5f3;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:700;color:#3d4f4a;max-width:160px;}
.switch{-webkit-appearance:none;appearance:none;width:46px;height:27px;flex-shrink:0;border-radius:99px;background:#dbe5e1;position:relative;cursor:pointer;transition:background .2s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s;}
.switch:checked{background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));}
.switch:checked::after{transform:translateX(19px);}

.bottom-nav{position:relative;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 22px rgba(16,64,54,.07);}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;border-radius:13px;font-size:10.5px;font-weight:800;letter-spacing:.2px;color:#8b9a96;transition:color .18s,background .18s;}
.nav-btn .ico{font-size:18px;line-height:1;filter:grayscale(1);opacity:.62;transition:.18s;}
.nav-btn.active{color:var(--primary-dark);background:var(--primary-soft);}
.nav-btn.active .ico{filter:none;opacity:1;transform:translateY(-1px);}
.nav-btn .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;font-size:10px;padding:0 5px;}
.fab{position:absolute;z-index:15;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));width:56px;height:56px;display:grid;place-items:center;border-radius:50%;font-size:27px;font-weight:400;line-height:1;color:#fff;background:linear-gradient(140deg,var(--primary-2),var(--primary-dark));box-shadow:var(--shadow-lg);transition:transform .14s ease,box-shadow .18s;}
.fab:active{transform:scale(.92);box-shadow:0 8px 18px rgba(10,124,102,.3);}

/* Topbar Select Actions */
.select-actions { display: flex; gap:10px; margin-top:15px; }
.select-actions .btn { flex:1; padding:10px; font-size:13px; }

#screen-chat{background:#e9efee;}
.chat-topbar{position:relative;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px 12px;background:linear-gradient(150deg,#13c08d 0%,#0fa585 55%,#0a7c66 100%);color:#fff;box-shadow:0 6px 18px rgba(10,80,66,.22);}
.chat-topbar-info{flex:1;min-width:0;}
.chat-topbar-info strong{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-topbar-info small{display:block;font-size:11px;color:rgba(255,255,255,.85);margin-top:1px;}
.chat-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:9px;padding:16px 12px 18px;background-color:#e9efee;background-image:radial-gradient(rgba(10,124,102,.075) 1px,transparent 1px);background-size:18px 18px;}
.day-divider{align-self:center;margin:2px 0 6px;padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.9);color:#5c6f6a;font-size:11px;font-weight:800;box-shadow:0 1px 4px rgba(16,64,54,.08);}
.msg{display:flex;max-width:84%;}
.msg.in{align-self:flex-start;justify-content:flex-start;}
.msg.out{align-self:flex-end;justify-content:flex-end;}
.msg.sys { align-self: center; justify-content: center; margin: 4px 0; max-width: 90%; }
.bubble{position:relative;padding:9px 13px 8px;border-radius:17px;font-size:14.5px;line-height:1.45;word-break:break-word;box-shadow:0 2px 7px rgba(16,64,54,.09);cursor:pointer;}
.msg.in .bubble{background:#fff;color:var(--text);border-top-left-radius:6px;}
.msg.out .bubble{background:linear-gradient(135deg,var(--primary-2),#0a9e83);color:#fff;border-top-right-radius:6px;}
.msg.sys .bubble{background:rgba(255,255,255,.7);color:#555;font-size:12px;font-style:italic;text-align:center;border-radius:10px; box-shadow:none; padding:5px 12px; cursor:default;}
.bubble .meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px;font-size:10px;opacity:.75;white-space:nowrap;}
.msg.out .bubble .meta{color:rgba(255,255,255,.9);}
.checks{font-size:11px;letter-spacing:-1px;color:rgba(255,255,255,.65);}
.checks.read{color:#d8fff2;}
.deleted{font-style:italic;opacity:.72;}
.reply-preview{padding:6px 10px;margin-bottom:6px;border-left:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);border-radius:6px;font-size:12.5px;opacity:.9;}
.msg.in .reply-preview{border-left-color:var(--primary);background:#f0f6f4;color:#3d4f4a;}
.sender-name{font-size:11px;font-weight:800;opacity:.75;margin-bottom:2px;display:flex;align-items:center;gap:4px;}
.chat-img{max-width:100%;border-radius:10px;margin-top:5px;}

.chat-input-bar{position:relative;z-index:6;display:flex;align-items:center;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(16,64,54,.06);}
.chat-input-wrap{flex:1;min-width:0;background:#f1f5f3;border:1.5px solid transparent;border-radius:24px;padding:0 16px;transition:background .18s,border-color .18s;}
.chat-input-wrap:focus-within{background:#fff;border-color:var(--primary-2);}
.chat-input-wrap input{width:100%;border:0;background:transparent;padding:12px 0;font-size:15px;}
.soft-btn{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-size:17px;color:#61746f;background:#f1f5f3;transition:background .16s,transform .12s;}
.soft-btn:active{transform:scale(.93);background:#e5ecea;}
.send-btn{width:45px;height:45px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-size:16px;color:#fff;background:linear-gradient(140deg,var(--primary-2),var(--primary-dark));box-shadow:0 8px 18px rgba(10,124,102,.32);transition:transform .12s;}
.send-btn:active{transform:scale(.92);}

.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f4f8f7;border-top:1px solid var(--line);}
.reply-bar .reply-content{flex:1;min-width:0;border-left:3px solid var(--primary);padding-left:10px;}
.reply-bar strong{display:block;font-size:12px;color:var(--primary-dark);}
.reply-bar span{display:block;font-size:12.5px;color:#5c6f6a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.toast{position:absolute;z-index:60;left:50%;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);max-width:86%;padding:11px 18px;border-radius:99px;background:rgba(18,33,29,.93);color:#fff;font-size:12.8px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 10px 26px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translate(-50%,0);}
#modal-root{position:absolute;inset:0;z-index:80;display:none;}
#modal-root:not(.hidden){display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,30,25,.55);backdrop-filter:blur(3px);animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{position:relative;width:100%;max-width:400px;max-height:85vh;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;animation:modalIn .22s cubic-bezier(.2,.9,.3,1);}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:none;}}
.modal-header{padding:18px 20px 12px;border-bottom:1px solid var(--line);}
.modal-header h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.modal-body .field{margin:0;}
.modal-footer{padding:12px 20px 18px;display:flex;gap:10px;}
.modal-footer .btn{flex:1;}
.menu-list{padding:6px 0;}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;font-size:14.5px;font-weight:600;text-align:left;transition:background .14s;}
.menu-item:active{background:#f4f8f7;}
.menu-item .ico{width:24px;text-align:center;font-size:16px;}
.search-result{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #f1f6f4;cursor:pointer;}
.search-result:active{background:#f4f8f7;}
.search-result:last-child{border-bottom:none;}
.search-result .info{flex:1;min-width:0;}
.search-result .info strong{display:flex;align-items:center;gap:4px;font-size:14.5px;}
.search-result .info span{display:block;font-size:12px;color:var(--primary-dark);}

.status-viewer{position:absolute;inset:0;background:#111;color:#fff;z-index:90;display:flex;flex-direction:column;}
.status-viewer .sv-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);}
.status-viewer .sv-header .info{flex:1;}
.status-viewer .sv-header strong{display:flex;align-items:center;gap:5px;font-size:14px;}
.status-viewer .sv-header small{display:block;font-size:11px;opacity:.75;}
.status-viewer .sv-body{flex:1;display:grid;place-items:center;padding:24px;text-align:center;font-size:24px;font-weight:700;line-height:1.4;word-break:break-word;overflow-y:auto;}
.status-viewer .sv-body img{max-height:100%;max-width:100%;border-radius:12px;object-fit:contain;}

/* CSS untuk Centang Biru */
.tick-svg { width: 18px; height: 18px; display: inline-block; vertical-align: middle; fill: #1D9BF0; flex-shrink: 0; }

/* Style Khusus Pengaturan Grup */
.settings-header { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.settings-header .avatar { width: 70px; height: 70px; font-size: 24px; }
.settings-group-title { font-size: 18px; font-weight: 800; margin: 0; text-align: center; }
.member-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f6f4; }
.member-item:last-child { border-bottom: none; }
.member-info { flex: 1; min-width: 0; }
.member-info strong { display: flex; align-items: center; gap: 4px; font-size: 14.5px; }
.badge-admin { font-size: 10px; background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
.badge-owner { font-size: 10px; background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell">

  <!-- AUTH -->
  <section id="screen-auth" class="screen active">
    <div class="auth-scroll">
      <div class="auth-hero">
        <div class="brand-badge">CG</div>
        <h1>Chat<span>Go</span></h1>
        <p>Chat modern tanpa nomor HP.<br>Cukup satu username — aman &amp; cepat.</p>
      </div>
      <div class="segmented" role="tablist">
        <button type="button" class="seg-btn active" data-auth="login">Masuk</button>
        <button type="button" class="seg-btn" data-auth="register">Daftar</button>
      </div>
      <form id="form-login" class="auth-form">
        <label class="field"><span>Username</span>
          <div class="input-wrap"><span class="prefix">@</span>
            <input id="login-user" type="text" placeholder="username" autocomplete="username" required>
          </div>
        </label>
        <label class="field"><span>Password / PIN</span>
          <div class="input-wrap"><input id="login-pass" type="password" placeholder="••••••" autocomplete="current-password" required></div>
        </label>
        <button type="submit" class="btn btn-primary" id="btn-login">Masuk</button>
      </form>
      <form id="form-register" class="auth-form hidden">
        <label class="field"><span>Nama Tampilan</span>
          <div class="input-wrap"><input id="reg-name" type="text" placeholder="Nama kamu" autocomplete="name" required></div>
        </label>
        <label class="field"><span>Username unik</span>
          <div class="input-wrap"><span class="prefix">@</span>
            <input id="reg-user" type="text" placeholder="username" autocomplete="username" required maxlength="20">
          </div>
          <p class="hint" id="reg-hint">3-20 karakter (huruf kecil, angka, _)</p>
        </label>
        <label class="field"><span>Password (min. 6 karakter)</span>
          <div class="input-wrap"><input id="reg-pass" type="password" placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password" required></div>
        </label>
        <button type="submit" class="btn btn-primary" id="btn-register">Buat Akun</button>
      </form>
    </div>
  </section>

  <!-- HOME -->
  <section id="screen-home" class="screen hidden">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <p class="topbar-hello">Selamat datang,</p>
          <h1 class="topbar-title"><span id="topbar-name">—</span></h1>
        </div>
        <div class="topbar-actions" id="topbar-actions">
          <button type="button" class="icon-btn ghost-light" id="btn-select-mode" title="Pilih Chat">☑️</button>
          <button type="button" class="icon-btn ghost-light" id="btn-focus" title="Mode Fokus">🌙</button>
          <button type="button" class="icon-btn ghost-light" id="btn-logout" title="Keluar">⏻</button>
        </div>
      </div>
      
      <!-- Search / Select Bar -->
      <div id="search-container">
        <div class="search-wrap">
          <span class="search-ico">🔍</span>
          <input id="search-input" type="text" placeholder="Cari chat atau username…" autocomplete="off">
        </div>
      </div>
      <div id="select-container" class="hidden">
        <div class="select-actions">
          <button class="btn btn-soft" id="btn-select-all">Pilih Semua</button>
          <button class="btn btn-danger" id="btn-hide-selected">Sembunyikan</button>
          <button class="btn btn-soft" id="btn-cancel-select">Batal</button>

      </div>
    </header>

    <main class="content" id="content">
      <div class="tab-panel active" id="tab-chats">
        <p class="section-title">Pesan</p>
        <div id="list-chats"></div>
      </div>

      <div class="tab-panel" id="tab-status">
        <p class="section-title">Status Saya</p>
        <div class="card status-add" id="status-add">
          <div class="avatar" id="my-status-avatar" style="--a:#12b886;--b:#0a7c66">R</div>
          <div class="status-info">
            <strong>Status saya</strong>
            <p class="muted small" style="margin:2px 0 0">Ketuk untuk menambah pembaruan</p>
          </div>
          <span class="plus-dot">+</span>
        </div>
        <p class="section-title">Pembaruan Terbaru</p>
        <div id="list-status"></div>
      </div>

      <div class="tab-panel" id="tab-requests">
        <p class="section-title">Permintaan Pesan</p>
        <div id="list-requests"></div>
      </div>

      <div class="tab-panel" id="tab-profile">
        <div class="card profile-card">
          <div class="avatar lg" id="me-avatar" style="--a:#12b886;--b:#0a7c66">R</div>
          <h3 id="me-name">—</h3>
          <p class="uname" id="me-username">@—</p>
          <p class="bio" id="me-bio">—</p>
          <div class="alias-chip">Username: <b id="me-alias">—</b></div>
          <div class="profile-actions">
            <button type="button" class="btn btn-soft sm" id="btn-edit-profile">Edit Profil</button>
            <button type="button" class="btn btn-soft sm" id="btn-change-photo">Ganti Foto</button>
          </div>
        </div>

        <p class="section-title">Privasi &amp; Fokus</p>
        <div class="card list-card">
          <label class="row">
            <span>Siapa yang bisa kirim pesan</span>
            <select id="priv-who">
              <option value="everyone">Semua orang</option>
              <option value="contacts">Hanya kontak</option>
