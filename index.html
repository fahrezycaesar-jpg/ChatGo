<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0fa585">
<title>ChatGo</title>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
    "firebase/messaging": "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js"
  }
}
</script>

<style>
:root{
  --primary:#0fa585;--primary-2:#12b886;--primary-dark:#0a7c66;
  --primary-soft:#e8f7f2;--bg:#eef2f5;--surface:#fff;
  --text:#12211d;--muted:#7c8c88;--line:#e6ecea;--danger:#e5484d;
  --nav-h:56px;--shadow-sm:0 2px 8px rgba(16,64,54,.06);
  --shadow-md:0 10px 26px rgba(16,64,54,.10);--shadow-lg:0 16px 34px rgba(10,124,102,.28);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  font-size:15px;color:var(--text);
  background:radial-gradient(circle at 15% 0%,#d6f2e9 0%,#eef2f5 45%,#e3ecf2 100%);
  display:flex;align-items:center;justify-content:center;
  height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
input,select,textarea{outline:none;}
img{display:block;max-width:100%;}
.hidden{display:none !important;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.muted{color:var(--muted);}.small{font-size:12px;}.center{text-align:center;}

/* SVG Helper Classes */
.svg-icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; fill: currentColor; flex-shrink: 0; }
.svg-icon-outline { width: 24px; height: 24px; display: inline-block; vertical-align: middle; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.app-shell{
  position:relative;width:100%;max-width:480px;
  height:100vh;height:100dvh;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);min-height:0;}
.screen.active{display:flex;animation:screenIn .22s ease both;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#screen-chat.active{animation:slideIn .24s cubic-bezier(.22,.9,.3,1) both;}
@keyframes slideIn{from{opacity:.4;transform:translateX(18px);}to{opacity:1;transform:none;}}
@media (min-width:520px){
  body{padding:18px;}
  .app-shell{height:min(calc(100dvh - 36px),900px);border-radius:30px;border:1px solid rgba(255,255,255,.7);box-shadow:0 30px 80px rgba(9,45,38,.22);}
  .screen{border-radius:30px;overflow:hidden;}
}

.auth-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom));}
.auth-hero{background:linear-gradient(150deg,#13c08d 0%,#0fa585 45%,#0a7c66 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 42px) 26px 34px;border-radius:0 0 34px 34px;text-align:center;box-shadow:0 12px 28px rgba(10,124,102,.22);}
.brand-badge{width:60px;height:60px;margin:0 auto 16px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:.5px;backdrop-filter:blur(6px);}
.auth-hero h1{margin:0 0 8px;font-size:28px;letter-spacing:.3px;}
.auth-hero h1 span{color:#c7f6e5;}
.auth-hero p{margin:0;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.88);}
.segmented{display:flex;gap:6px;background:#e2eae7;padding:5px;border-radius:16px;margin:20px 22px 0;}
.seg-btn{flex:1;padding:11px 8px;border-radius:12px;font-weight:700;font-size:14px;color:#5c6f6a;transition:all .18s ease;}
.seg-btn.active{background:#fff;color:var(--primary-dark);box-shadow:0 3px 10px rgba(10,60,50,.12);}
.auth-form{display:flex;flex-direction:column;gap:15px;padding:22px 22px 0;}
.field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:700;color:#43544f;}
.field>span{padding-left:2px;}
.input-wrap{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;transition:border-color .18s,box-shadow .18s;}
.input-wrap:focus-within{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(18,184,134,.14);}
.input-wrap input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:15px;}
.input-wrap .prefix{color:var(--muted);font-weight:800;}
.hint{margin:0;font-size:12px;color:var(--muted);padding-left:2px;}
.hint.ok{color:var(--primary-dark);font-weight:700;}
.hint.err{color:var(--danger);font-weight:700;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:15px;font-weight:800;font-size:15px;transition:transform .12s ease,box-shadow .18s ease,background .18s;border:none;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));color:#fff;box-shadow:0 12px 24px rgba(10,124,102,.28);}
.btn-soft{background:var(--primary-soft);color:var(--primary-dark);box-shadow:none;}
.btn-danger{background:#fdecec;color:var(--danger);}
.btn.sm{width:auto;padding:11px 18px;font-size:13.5px;border-radius:12px;}
.auth-note{margin:0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;}

.topbar{position:relative;z-index:6;background:linear-gradient(150deg,#13c08d 0%,#0fa585 50%,#0a7c66 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 18px;border-radius:0 0 26px 26px;box-shadow:0 8px 22px rgba(10,80,66,.20);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar-hello{margin:0 0 3px;font-size:12px;color:rgba(255,255,255,.82);}
.topbar-title{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#4b5f5a;transition:background .16s,transform .12s;flex-shrink:0;}
.icon-btn:active{transform:scale(.94);}
.ghost-light{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);}
.search-wrap{display:flex;align-items:center;gap:10px;margin-top:15px;padding:0 14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.26);border-radius:15px;backdrop-filter:blur(6px);}
.search-wrap .search-ico{opacity:.9;display:flex;}
.search-wrap input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:14px;color:#fff;}
.search-wrap input::placeholder{color:rgba(255,255,255,.78);}

.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px calc(var(--nav-h) + 84px);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadeUp .2s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-title{margin:6px 4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#8b9a96;}
.section-title:not(:first-child){margin-top:22px;}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;background:#fff;border:1px dashed var(--line);border-radius:18px;}

.avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px;background:linear-gradient(140deg,var(--a,#12b886),var(--b,#0a7c66));box-shadow:0 4px 12px rgba(10,90,75,.18);user-select:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:38px;height:38px;font-size:13px;}
.avatar.lg{width:82px;height:82px;font-size:28px;margin:0 auto;}
.badge{min-width:21px;height:21px;padding:0 6px;display:inline-grid;place-items:center;border-radius:99px;background:linear-gradient(135deg,var(--primary-2),var(--primary-dark));color:#fff;font-size:11px;font-weight:800;font-style:normal;flex-shrink:0;box-shadow:0 3px 8px rgba(10,124,102,.28);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);}
.tag{font-size:11px;line-height:1;}

.chat-item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s ease,background .16s,box-shadow .16s;}
.chat-item:active{transform:scale(.988);background:#fbfdfc;box-shadow:0 1px 4px rgba(16,64,54,.06);}
.chat-item.selected {border-color: var(--primary); background: var(--primary-soft);}
.chat-checkbox { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ccc; display: none; flex-shrink: 0; }
.select-mode-active .chat-checkbox { display: block; }
.chat-item.selected .chat-checkbox { background: var(--primary); border-color: var(--primary); position:relative;}
.chat-item.selected .chat-checkbox::after { content:"✓"; position:absolute; color:#fff; font-size:12px; font-weight:bold; top:-2px; left:4px;}
.chat-item-body{flex:1;min-width:0;}
.chat-top{display:flex;align-items:baseline;gap:8px;}
.chat-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;}
.chat-time{font-size:11px;color:var(--muted);flex-shrink:0;font-weight:600;}
.chat-preview{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13px;color:var(--muted);}
.chat-preview>span{flex:1;min-width:0;}

.status-add{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;transition:background .16s;}
.status-add:active{background:#fbfdfc;}
.status-add strong{display:block;font-size:14.5px;}
.status-add p{margin:2px 0 0;font-size:12px;}
.plus-dot{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);font-size:17px;font-weight:800;}
.status-item{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s ease;}
.status-item:active{transform:scale(.988);}
.status-ring{padding:2.5px;border-radius:50%;background:linear-gradient(140deg,#13c08d,#0a7c66);flex-shrink:0;}
.status-ring.seen{background:#cfdad7;}
.status-ring .avatar{box-shadow:none;}
.status-info{flex:1;min-width:0;}
.status-info strong{display:block;font-size:14.5px;font-weight:700;}
.status-info span{display:block;margin-top:2px;font-size:12px;color:var(--muted);}
.status-badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary-dark);flex-shrink:0;}

.profile-card{padding:22px 18px 20px;text-align:center;background:linear-gradient(180deg,#ffffff,#f8fdfb);}
.profile-card h3{margin:14px 0 2px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;}
.profile-card .uname{margin:0;font-size:13px;color:var(--primary-dark);font-weight:700;}
.profile-card .bio{margin:9px 0 0;font-size:13px;color:var(--muted);line-height:1.55;}
.alias-chip{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;background:#f1f7f5;border:1px dashed #cfe3dd;font-size:12px;color:#4b5f5a;}
.alias-chip b{color:var(--primary-dark);}
.profile-actions{display:flex;gap:10px;margin-top:16px;}
.profile-actions .btn{flex:1;}
.list-card{padding:2px 14px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 2px;font-size:13.8px;font-weight:600;text-align:left;border-bottom:1px solid #f1f6f4;background:transparent;transition:opacity .15s;color:var(--text);}
.list-card .row:last-child{border-bottom:0;}
.row:active{opacity:.65;}
.row .row-ico{margin-right:8px;display:flex;align-items:center;}
.row select{border:0;background:#f1f5f3;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:700;color:#3d4f4a;max-width:160px;}

/* BOTTOM NAV (UPDATED WITH SVG) */
.bottom-nav{position:relative;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 22px rgba(16,64,54,.07);}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 2px;border-radius:13px;font-size:11px;font-weight:800;letter-spacing:.2px;color:#8b9a96;transition:color .18s,background .18s;}
.nav-btn .nav-icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: .18s; }
.nav-btn.active{color:var(--primary-dark);background:var(--primary-soft);}
.nav-btn.active .nav-icon{transform:translateY(-1px);}

.fab{position:absolute;z-index:15;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));width:56px;height:56px;display:grid;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(140deg,var(--primary-2),var(--primary-dark));box-shadow:var(--shadow-lg);transition:transform .14s ease,box-shadow .18s;}
.fab:active{transform:scale(.92);box-shadow:0 8px 18px rgba(10,124,102,.3);}

.select-actions { display: flex; gap:10px; margin-top:15px; }
.select-actions .btn { flex:1; padding:10px; font-size:13px; }

#screen-chat{background:#e9efee;}
.chat-topbar{position:relative;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px 12px;background:linear-gradient(150deg,#13c08d 0%,#0fa585 55%,#0a7c66 100%);color:#fff;box-shadow:0 6px 18px rgba(10,80,66,.22);}
.chat-topbar-info{flex:1;min-width:0;}
.chat-topbar-info strong{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-topbar-info small{display:block;font-size:11px;color:rgba(255,255,255,.85);margin-top:1px;}
.chat-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:9px;padding:16px 12px 18px;background-color:#e9efee;background-image:radial-gradient(rgba(10,124,102,.075) 1px,transparent 1px);background-size:18px 18px;}
.day-divider{align-self:center;margin:2px 0 6px;padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.9);color:#5c6f6a;font-size:11px;font-weight:800;box-shadow:0 1px 4px rgba(16,64,54,.08);}
.msg{display:flex;max-width:84%;}
.msg.in{align-self:flex-start;justify-content:flex-start;}
.msg.out{align-self:flex-end;justify-content:flex-end;}
.msg.sys { align-self: center; justify-content: center; margin: 4px 0; max-width: 90%; }
.bubble{position:relative;padding:9px 13px 8px;border-radius:17px;font-size:14.5px;line-height:1.45;word-break:break-word;box-shadow:0 2px 7px rgba(16,64,54,.09);cursor:pointer;}
.msg.in .bubble{background:#fff;color:var(--text);border-top-left-radius:6px;}
.msg.out .bubble{background:linear-gradient(135deg,var(--primary-2),#0a9e83);color:#fff;border-top-right-radius:6px;}
.msg.sys .bubble{background:rgba(255,255,255,.7);color:#555;font-size:12px;font-style:italic;text-align:center;border-radius:10px; box-shadow:none; padding:5px 12px; cursor:default;}
.bubble .meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px;font-size:10px;opacity:.75;white-space:nowrap;}
.msg.out .bubble .meta{color:rgba(255,255,255,.9);}
.checks{font-size:11px;letter-spacing:-1px;color:rgba(255,255,255,.65);}
.checks.read{color:#34B7F1;}
.deleted{font-style:italic;opacity:.72;}
.reply-preview{padding:6px 10px;margin-bottom:6px;border-left:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);border-radius:6px;font-size:12.5px;opacity:.9;}
.msg.in .reply-preview{border-left-color:var(--primary);background:#f0f6f4;color:#3d4f4a;}
.sender-name{font-size:11px;font-weight:800;opacity:.75;margin-bottom:2px;display:flex;align-items:center;gap:4px;}
.chat-img{max-width:100%;border-radius:10px;margin-top:5px;}

.typing-indicator { align-self: flex-start; padding: 8px 14px; background: #fff; border-radius: 18px; border-top-left-radius: 4px; font-size: 12px; color: #7c8c88; font-style: italic; box-shadow: 0 2px 5px rgba(0,0,0,.05); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
.typing-dots { display: flex; gap: 3px; }
.typing-dots span { width: 4px; height: 4px; background: #7c8c88; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

.chat-input-bar{position:relative;z-index:6;display:flex;align-items:center;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(16,64,54,.06);}
.chat-input-wrap{flex:1;min-width:0;background:#f1f5f3;border:1.5px solid transparent;border-radius:24px;padding:0 16px;transition:background .18s,border-color .18s;}
.chat-input-wrap:focus-within{background:#fff;border-color:var(--primary-2);}
.chat-input-wrap input{width:100%;border:0;background:transparent;padding:12px 0;font-size:15px;}
.soft-btn{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:#61746f;background:#f1f5f3;transition:background .16s,transform .12s;}
.soft-btn:active{transform:scale(.93);background:#e5ecea;}
.send-btn{width:45px;height:45px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(140deg,var(--primary-2),var(--primary-dark));box-shadow:0 8px 18px rgba(10,124,102,.32);transition:transform .12s;}
.send-btn:active{transform:scale(.92);}

.stranger-bar { padding: 15px; background: #fff; border-top: 1px solid var(--line); text-align: center; }
.stranger-bar p { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
.stranger-actions { display: flex; gap: 10px; }
.stranger-actions .btn { flex: 1; padding: 10px; font-size: 14px; }

.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f4f8f7;border-top:1px solid var(--line);}
.reply-bar .reply-content{flex:1;min-width:0;border-left:3px solid var(--primary);padding-left:10px;}
.reply-bar strong{display:block;font-size:12px;color:var(--primary-dark);}
.reply-bar span{display:block;font-size:12.5px;color:#5c6f6a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.toast{position:absolute;z-index:60;left:50%;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);max-width:86%;padding:11px 18px;border-radius:99px;background:rgba(18,33,29,.93);color:#fff;font-size:12.8px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 10px 26px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translate(-50%,0);}
#modal-root{position:absolute;inset:0;z-index:80;display:none;}
#modal-root:not(.hidden){display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,30,25,.55);backdrop-filter:blur(3px);animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{position:relative;width:100%;max-width:400px;max-height:85vh;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;animation:modalIn .22s cubic-bezier(.2,.9,.3,1);}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:none;}}
.modal-header{padding:18px 20px 12px;border-bottom:1px solid var(--line);}
.modal-header h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.modal-body .field{margin:0;}
.modal-footer{padding:12px 20px 18px;display:flex;gap:10px;}

.tick-svg { width: 18px; height: 18px; display: inline-block; vertical-align: middle; fill: #1D9BF0; flex-shrink: 0; }

  const classes = 'avatar' + (cls ? ' ' + cls : '');
  const idAttr = id ? ` id="${esc(id)}"` : '';
  if (photo) return `<div class="${classes}"${idAttr}><img src="${esc(photo)}" alt=""></div>`;
  return `<div class="${classes}"${idAttr} style="--a:${a};--b:${b}">${esc(initialsFor(name))}</div>`;
}

function setAvatarEl(el, name, photo, extraCls = '') {
  if (!el) return;
  el.className = 'avatar' + (extraCls ? ' ' + extraCls : '');
  const [a, b] = colorFor(name || '?');
  el.style.setProperty('--a', a); el.style.setProperty('--b', b);
  if (photo) el.innerHTML = `<img src="${esc(photo)}" alt="">`;
  else el.innerHTML = esc(initialsFor(name));
}

function showModal(html, onMount) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal">${html}</div></div>`;
  root.classList.remove('hidden');
  root.querySelector('.modal-backdrop').addEventListener('click', e => {
    if (e.target.classList.contains('modal-backdrop')) closeModal();
  });
  if (onMount) onMount(root);
}
function closeModal() { const root = $('#modal-root'); root.innerHTML = ''; root.classList.add('hidden'); }

function showNotif(title, body, chatId) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const notif = new Notification(title, {
      body: body, icon: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(title) + '&background=0fa585&color=fff',
      tag: chatId, renotify: true
    });
    notif.onclick = function() { window.focus(); if (chatId) openChat(chatId); this.close(); };
  }
}

/* AUTH */
async function registerUser(displayName, username, password) {
  const uname = username.toLowerCase().trim();
  if (!/^[a-z0-9_]{3,20}$/.test(uname)) throw new Error('Username harus 3-20 karakter');
  if (password.length < 6) throw new Error('Password minimal 6 karakter');
  if (!displayName.trim()) throw new Error('Nama tampilan wajib');
  const unameSnap = await getDoc(doc(db, 'usernames', uname));
  if (unameSnap.exists()) throw new Error('Username sudah dipakai');
  const cred = await createUserWithEmailAndPassword(auth, emailFor(uname), password);
  const uid = cred.user.uid;
  await setDoc(doc(db, 'usernames', uname), { uid, createdAt: serverTimestamp() });
  await setDoc(doc(db, 'users', uid), {
    displayName: displayName.trim(), username: uname, bio: '', photoURL: '',
    privacy: { whoCanMessage: 'everyone' },
    blocked: [], hiddenChats: [], isVerified: false, isBanned: false, createdAt: serverTimestamp()
  });
  await addDoc(collection(db, 'chats'), {
    type: 'self', name: 'Catatan Pribadi', members: [uid],
    lastMessage: { text: 'Pesan tersimpan', senderId: uid, senderName: displayName },
    updatedAt: serverTimestamp(), createdAt: serverTimestamp()
  });
}

async function loginUser(username, password) {
  return signInWithEmailAndPassword(auth, emailFor(username.toLowerCase().trim()), password);
}

async function loadProfileAndShow(user) {
  let snap = null;
  for (let i = 0; i < 10; i++) {
    snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) break;
    await new Promise(r => setTimeout(r, 500));
  }
  if (!snap || !snap.exists()) { showModal(`<div class="modal-body"><p class="muted small">Gagal memuat profil.</p></div><div class="modal-footer"><button class="btn btn-soft" onclick="location.reload()">Tutup</button></div>`); return; }
  if (snap.data().isBanned) {
    showModal(`<div class="modal-header"><h3>Akses Ditolak 🚫</h3></div><div class="modal-body"><p class="muted small">Akun Anda diblokir.</p></div><div class="modal-footer"><button class="btn btn-soft" id="banned-logout">Keluar</button></div>`, root => { root.querySelector('#banned-logout').onclick = () => { closeModal(); signOut(auth); }; });
    return;
  }
  STATE.uid = user.uid;
  STATE.me = { uid: user.uid, ...snap.data() };
  updateProfileUI();
  showScreen('screen-home');
  attachListeners();
  setupFCM();
}

onAuthStateChanged(auth, async user => {
  detachListeners();
  if (!user) { STATE.uid = null; STATE.me = null; showScreen('screen-auth'); return; }
  STATE.uid = user.uid;
  await loadProfileAndShow(user);
});

function updateProfileUI() {
  const me = STATE.me; if (!me) return;
  const tick = me.isVerified ? BLUE_TICK_SVG : '';
  if ($('#topbar-name')) $('#topbar-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-name')) $('#me-name').innerHTML = esc(me.displayName) + tick;
  if ($('#me-username')) $('#me-username').textContent = '@' + me.username;
  if ($('#me-bio')) $('#me-bio').textContent = me.bio || 'Belum ada bio';

  setAvatarEl($('#my-status-avatar'), me.displayName, me.photoURL);
  setAvatarEl($('#me-avatar'), me.displayName, me.photoURL, 'lg');
  if($('#priv-who')) $('#priv-who').value = me.privacy?.whoCanMessage || 'everyone';
}

function detachListeners() {
  ['unsubChats','unsubStatuses','unsubMsgs','unsubTyping'].forEach(k => {
    if (STATE[k]) { try { STATE[k](); } catch(e){} STATE[k] = null; }
  });
}
function attachListeners() { detachListeners(); listenChats(); listenStatuses(); }

function listenChats() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', STATE.uid));
  STATE.unsubChats = onSnapshot(q, snap => {
    const all = [];
    const hidden = STATE.me.hiddenChats || [];
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (!c.isBanned && (!hidden.includes(c.id) || (c.pendingFor && c.pendingFor.includes(STATE.uid)))) {
        all.push(c);
      }
    });
    STATE.chats = all;
    STATE.chats.sort((a, b) => {
      if (a.type === 'self') return -1;
      if (b.type === 'self') return 1;
      return (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0);
    });
    renderChats();
  });
}

$('#btn-select-mode').addEventListener('click', () => {

function chatDisplayName(chat) {
  if (chat.type === 'self') return 'Catatan Pribadi';
  if (chat.type === 'group') return chat.name || 'Grup';
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberNames?.[otherUid] || chat.name || 'Chat';
}
function getChatTick(chat) {
  if (chat.type === 'group' && chat.isVerified) return BLUE_TICK_SVG;
  if (chat.type === 'direct') {
    const otherUid = (chat.members || []).find(u => u !== STATE.uid);
    if (chat.memberVerified && chat.memberVerified[otherUid]) return BLUE_TICK_SVG;
  }
  return '';
}
function chatDisplayPhoto(chat) {
  if (chat.type === 'self') return null;
  if (chat.type === 'group') return chat.photoURL || null;
  const otherUid = (chat.members || []).find(u => u !== STATE.uid);
  return chat.memberPhotos?.[otherUid] || null;
}

function renderChats() {
  const list = $('#list-chats');
  const filter = ($('#search-input').value || '').toLowerCase().trim();
  const items = STATE.chats.filter(c => {
    if (!filter) return true;
    return chatDisplayName(c).toLowerCase().includes(filter);
  });

  if (!items.length) { list.innerHTML = `<div class="empty">Belum ada chat.</div>`; return; }
  
  list.innerHTML = items.map(chat => {
    const name = chatDisplayName(chat);
    const photo = chatDisplayPhoto(chat);
    const tick = getChatTick(chat);
    const last = chat.lastMessage;
    const isPending = chat.pendingFor && chat.pendingFor.includes(STATE.uid);
    
    let preview = last ? (last.senderId === STATE.uid ? 'Kamu: ' : '') + (last.text || '📎 Media') : 'Belum ada pesan';
    if (isPending) preview = '<span style="color:var(--danger);font-weight:bold;">Permintaan pesan masuk</span>';
    
    const time = last?.createdAt ? fmtTime(last.createdAt) : (chat.updatedAt ? fmtTime(chat.updatedAt) : '');
    const unread = (chat.unread || {})[STATE.uid] || 0;
    const icons = [chat.type === 'self' ? '📝' : '', chat.type === 'group' ? '👥' : ''].filter(Boolean).map(i => `<span class="tag">${i}</span>`).join('');
    const isSelected = STATE.selectedChats.has(chat.id) ? 'selected' : '';

    return `<div class="chat-item ${isSelected}" data-chat="${chat.id}">
      <div class="chat-checkbox"></div>
      ${avatarHTML(name, photo)}
      <div class="chat-item-body">
        <div class="chat-top">
          <div class="chat-name">${icons}<span class="truncate">${esc(name)}</span> ${tick}</div>
          <span class="chat-time">${esc(time)}</span>
        </div>
        <div class="chat-preview">
          <span class="truncate">${preview}</span>
          ${(!STATE.isSelectMode && unread && !isPending) ? `<em class="badge">${unread}</em>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

$('#list-chats').addEventListener('click', e => {
  const item = e.target.closest('[data-chat]'); if (!item) return;
  const chatId = item.dataset.chat;
  if (STATE.isSelectMode) {
    if (STATE.selectedChats.has(chatId)) STATE.selectedChats.delete(chatId);
    else STATE.selectedChats.add(chatId);
    renderChats();
  } else {
    openChat(chatId);
  }
});

function listenStatuses() {
  const q = query(collection(db, 'status'), orderBy('createdAt', 'desc'), limit(50));
  STATE.unsubStatuses = onSnapshot(q, snap => {
    const now = Date.now();
    const contactUids = STATE.chats.filter(c => c.type === 'direct' && (!c.pendingFor || c.pendingFor.length === 0)).map(c => c.members.find(u => u !== STATE.uid));
    STATE.statuses = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(s => s.expiresAt?.toMillis?.() > now)
      .filter(s => s.userId === STATE.uid || contactUids.includes(s.userId));
    renderStatuses();
  });
}

function renderStatuses() {
  const list = $('#list-status');
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid);
  const otherStatuses = STATE.statuses.filter(s => s.userId !== STATE.uid);
  const myCard = $('#status-add');
  if (myStatuses.length > 0) {
    myCard.innerHTML = `<div class="status-ring" style="padding:2px;background:linear-gradient(140deg,#13c08d,#0a7c66);border-radius:50%;box-shadow:none">${avatarHTML(myStatuses[0].userName, myStatuses[0].userPhoto, '', 'my-status-avatar')}</div><div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">${myStatuses.length} pembaruan</p></div><span class="plus-dot">+</span>`;
  } else {
    myCard.innerHTML = `${avatarHTML(STATE.me.displayName, STATE.me.photoURL, '', 'my-status-avatar')}<div class="status-info"><strong>Status saya</strong><p class="muted small" style="margin:2px 0 0">Ketuk untuk menambah</p></div><span class="plus-dot">+</span>`;
  }
  myCard.onclick = openMyStatusesModal;
  if (!otherStatuses.length) { list.innerHTML = `<div class="empty">Belum ada status dari kontakmu.</div>`; return; }
  list.innerHTML = otherStatuses.map(s => `<div class="status-item" data-status="${s.id}"><div class="status-ring ${(s.viewers || []).includes(STATE.uid) ? 'seen' : ''}">${avatarHTML(s.userName, s.userPhoto)}</div><div class="status-info"><strong class="truncate">${esc(s.userName)}</strong><span>${esc(fmtRel(s.createdAt))}</span></div><span class="status-badge">${s.type === 'image' ? '📷' : '📝'}</span></div>`).join('');
}

function openMyStatusesModal() {
  const myStatuses = STATE.statuses.filter(s => s.userId === STATE.uid);
  showModal(`<div class="modal-header"><h3>Status Saya (${myStatuses.length})</h3></div><div class="modal-body"><button class="btn btn-primary" id="ms-add">+ Tambah Status Baru</button><div id="ms-list">${myStatuses.length ? myStatuses.map(s => `<div class="status-item" style="cursor:default"><div class="status-ring">${avatarHTML(s.userName, s.userPhoto)}</div><div class="status-info"><strong>${esc(s.type === 'image' ? '📷 Foto' : '📝 Teks')}</strong><span>${esc(fmtRel(s.createdAt))}</span></div><button class="btn btn-soft sm" data-ms-view="${s.id}" style="padding:8px 12px;font-size:12px">Lihat</button><button class="btn btn-danger sm" data-ms-del="${s.id}" style="padding:8px 12px;font-size:12px">${SVG_TRASH}</button></div>`).join('') : '<p class="muted small center">Belum ada status.</p>'}</div></div><div class="modal-footer"><button class="btn btn-soft" id="ms-close">Tutup</button></div>`, root => {

    root.querySelector('#ms-add').onclick = () => { closeModal(); openNewStatusModal(); };

    root.querySelectorAll('[data-ms-del]').forEach(b => b.onclick = async () => { if(confirm('Hapus?')){await deleteDoc(doc(db,'status',b.dataset.msDel));closeModal();} });

}
$('#list-status').addEventListener('click', e => {
  const item = e.target.closest('[data-status]'); if (!item) return;

function openStatusViewer(s) {

  if(isMine) wrap.querySelector('#sv-delete').onclick = async () => { if(confirm('Hapus?')){await deleteDoc(doc(db,'status',s.id));wrap.remove();} };
}
function openNewStatusModal() {
  showModal(`<div class="modal-header"><h3>Buat Status</h3></div><div class="modal-body"><label class="field"><span>Status teks</span><div class="input-wrap"><input id="status-text" type="text" maxlength="120" placeholder="Apa yang kamu pikirkan?"></div></label><p class="muted small">Atau unggah foto.</p><button type="button" class="btn btn-soft" id="status-photo-btn">📷 Pilih Foto</button></div><div class="modal-footer"><button class="btn btn-soft" id="status-cancel">Batal</button><button class="btn btn-primary" id="status-save">Bagikan</button></div>`, root => {

    root.querySelector('#status-cancel').onclick = closeModal;
    root.querySelector('#status-photo-btn').onclick = () => {
      const fi = document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none'; document.body.appendChild(fi);
      fi.onchange = e => { photoFile = e.target.files?.[0]; if(photoFile){ if(photoFile.size>10485760){toast('Maks 10MB');photoFile=null;} else {root.querySelector('#status-photo-btn').textContent='📷 '+photoFile.name;} } document.body.removeChild(fi); };
      fi.click();

$('#chat-back').addEventListener('click', () => {

  if (STATE.currentChat && STATE.currentChat.type === 'group') openGroupSettings(STATE.currentChat.id);

async function openChat(chatId) {
  const snap = await getDoc(doc(db, 'chats', chatId));
  if (!snap.exists()) return;
  const data = snap.data();
  if (data.isBanned) { toast('Chat diblokir admin.'); return; }
  if (data.pins && data.pins[STATE.uid]) {
    showModal(`<div class="modal-header"><h3>Chat Terkunci ${SVG_LOCK}</h3></div><div class="modal-body"><label class="field"><span>PIN</span><div class="input-wrap"><input id="unlock-pin" type="password" maxlength="6"></div></label></div><div class="modal-footer"><button class="btn btn-soft" id="unlock-cancel">Batal</button><button class="btn btn-primary" id="unlock-btn">Buka</button></div>`, r => {
      r.querySelector('#unlock-cancel').onclick = closeModal;
      r.querySelector('#unlock-btn').onclick = () => { if(r.querySelector('#unlock-pin').value === data.pins[STATE.uid]) { closeModal(); proceedOpenChat(chatId, data); } else toast('PIN salah'); };
    }); return;
  }
  proceedOpenChat(chatId, data);
}

function proceedOpenChat(chatId, chat) {
  STATE.currentChat = { id: chatId, ...chat }; STATE.replyTo = null; STATE.timerSec = 0; hideReplyBar();
  const name = chatDisplayName(chat); const photo = chatDisplayPhoto(chat); const tick = getChatTick(chat);
  $('#chat-name').innerHTML = esc(name) + tick;
  $('#chat-sub').textContent = chat.type === 'self' ? 'Catatan pribadi' : (chat.type === 'group' ? (chat.members?.length || 0) + ' anggota' : '@' + (chat.memberUsernames?.[chat.members.find(u => u !== STATE.uid)] || '—'));
  setAvatarEl($('#chat-avatar'), name, photo, 'sm');
  
  const isPending = chat.pendingFor && chat.pendingFor.includes(STATE.uid);
  if (isPending) {
    $('#stranger-bar').classList.remove('hidden');
    $('#composer').classList.add('hidden');
    if ((chat.unread || {})[STATE.uid]) updateDoc(doc(db, 'chats', chatId), { ['unread.'+STATE.uid]: 0 });
  } else {
    $('#stranger-bar').classList.add('hidden');
    $('#composer').classList.remove('hidden');
    if ((chat.unread || {})[STATE.uid]) updateDoc(doc(db, 'chats', chatId), { ['unread.'+STATE.uid]: 0 });
  }

  showScreen('screen-chat');
  if (STATE.unsubMsgs) STATE.unsubMsgs();
  if (STATE.unsubTyping) STATE.unsubTyping();
  listenMessages(chatId);
  listenTyping(chatId);
}

$('#btn-stranger-accept').addEventListener('click', async () => {

  await updateDoc(doc(db, 'chats', STATE.currentChat.id), { pendingFor: arrayRemove(STATE.uid) });
  STATE.currentChat.pendingFor = []; 
  $('#stranger-bar').classList.add('hidden');
  $('#composer').classList.remove('hidden');
  toast('Pesan diterima');
});
$('#btn-stranger-block').addEventListener('click', async () => {
  if (!STATE.currentChat) return;
  const otherUid = (STATE.currentChat.members || []).find(u => u !== STATE.uid);
  await updateDoc(doc(db, 'users', STATE.uid), { blocked: arrayUnion(otherUid) });
  await deleteDoc(doc(db, 'chats', STATE.currentChat.id));

});

function listenTyping(chatId) {
  const q = collection(db, 'chats', chatId, 'typing');
  STATE.unsubTyping = onSnapshot(q, snap => {
    const now = Date.now();
    let isTyping = false; let typingName = '';
    snap.forEach(d => {
      if (d.id !== STATE.uid) {
        const data = d.data();
        const time = data.timestamp ? (data.timestamp.toMillis ? data.timestamp.toMillis() : Date.now()) : Date.now();
        if (now - time < 3000) { isTyping = true; typingName = data.name; }
      }
    });

    const exist = $('#typing-ui');
    if (isTyping) {
      const text = STATE.currentChat.type === 'group' ? `${esc(typingName)} sedang mengetik...` : 'sedang mengetik...';
      if (exist) { exist.querySelector('span').textContent = text; } 
      else {
        const div = document.createElement('div');
        div.id = 'typing-ui';
        div.className = 'typing-indicator';
        div.innerHTML = `<span>${text}</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
        $('#chat-body').appendChild(div);
        $('#chat-body').scrollTop = $('#chat-body').scrollHeight;
      }
    } else if (exist) { exist.remove(); }
  });
}

let typingTimer;
$('#chat-input').addEventListener('input', () => {
  if (!STATE.currentChat || STATE.currentChat.pendingFor?.includes(STATE.uid)) return;
  if (!STATE.isTypingActive) {
    STATE.isTypingActive = true;
    const typingRef = doc(db, 'chats', STATE.currentChat.id, 'typing', STATE.uid);
    setDoc(typingRef, { name: STATE.me.displayName, timestamp: serverTimestamp() });
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(async () => {
    STATE.isTypingActive = false;
    if (STATE.currentChat) { try { await deleteDoc(doc(db, 'chats', STATE.currentChat.id, 'typing', STATE.uid)); } catch(e){} }
  }, 2000);
});

function listenMessages(chatId) {
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(300));
  STATE.unsubMsgs = onSnapshot(q, snap => {
    const now = Date.now();
    const newMsgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => !(m.deletedFor||[]).includes(STATE.uid) && (!m.expiresAt || m.expiresAt.toMillis() > now));
    if (STATE.currentChat.messages && newMsgs.length > STATE.currentChat.messages.length) {
       const last = newMsgs[newMsgs.length - 1];
       if (last.senderId !== STATE.uid && last.type !== 'system') playMsgSound();
    }
    STATE.currentChat.messages = newMsgs;
    renderMessages();
  });
}

function renderMessages() {
  const chat = STATE.currentChat; if (!chat) return;
  const box = $('#chat-body'); const msgs = chat.messages || [];
  if (!msgs.length) { box.innerHTML = `<div class="day-divider">Belum ada pesan</div>`; return; }
  box.innerHTML = `<div class="day-divider">Percakapan</div>` + msgs.map(m => {
    if (m.type === 'system') { return `<div class="msg sys"><div class="bubble">${esc(m.text)}</div></div>`; }
    const isOut = m.senderId === STATE.uid; const time = fmtTime(m.createdAt);
    const check = isOut ? (m.status === 'read' ? '<span class="checks read">✓✓</span>' : '<span class="checks">✓</span>') : '';
    const sender = (!isOut && chat.type === 'group') ? `<div class="sender-name">${esc(m.senderName || '')}</div>` : '';
    let body = m.isDeletedForEveryone ? '<span class="deleted">Dihapus</span>' : esc(m.text || '');
    if (m.type === 'image' && m.mediaUrl) body = `<img src="${esc(m.mediaUrl)}" class="chat-img" onclick="window.open('${esc(m.mediaUrl)}','_blank')">`;
    const reply = m.replyTo ? `<div class="reply-preview"><b>${esc(m.replyTo.senderName || '')}</b><br>${esc(m.replyTo.text || '')}</div>` : '';
    return `<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble">${sender}${reply}${body}<span class="meta">${esc(time)} ${check}</span></div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(text, type = 'text', mediaUrl = null) {
  const chat = STATE.currentChat; if (!chat || (!text.trim() && !mediaUrl)) return;
  if (chat.type === 'group' && chat.onlyAdminsCanChat) {
    const isAdmin = chat.createdBy === STATE.uid || (chat.admins || []).includes(STATE.uid);
    if (!isAdmin) { toast('Hanya Admin yang bisa chat di grup ini'); return; }
  }
  const payload = {
    senderId: STATE.uid, senderName: STATE.me.displayName, text: text.trim(), type: type, status: 'sent',
    createdAt: serverTimestamp(), replyTo: STATE.replyTo ? { text: STATE.replyTo.text || '📎', senderName: STATE.replyTo.senderName } : null,
    timer: STATE.timerSec || 0, isDeletedForEveryone: false, deletedFor: []
  };
  if (mediaUrl) payload.mediaUrl = mediaUrl;
  if (STATE.timerSec) payload.expiresAt = Timestamp.fromMillis(Date.now() + STATE.timerSec * 1000);
  await addDoc(collection(db, 'chats', chat.id, 'messages'), payload);
  playMsgSound();
  const unread = {}; (chat.members || []).filter(u => u !== STATE.uid).forEach(u => unread['unread.'+u] = ((chat.unread||{})[u]||0)+1);
  await updateDoc(doc(db, 'chats', chat.id), { lastMessage: { text: type==='image'?'📷 Foto':payload.text, senderId: STATE.uid, senderName: STATE.me.displayName, createdAt: serverTimestamp() }, updatedAt: serverTimestamp(), ...unread });
  STATE.replyTo = null; STATE.timerSec = 0; hideReplyBar(); $('#chat-input').value = '';
}

    const uname = $('#login-user').value.toLowerCase().trim();
    const pass = $('#login-pass').value;
    let accounts = JSON.parse(localStorage.getItem('chatgo_accounts') || '[]');
    accounts = accounts.filter(a => a.username !== uname); 
    accounts.push({ username: uname, password: pass, displayName: uname, photoURL: '' }); 
    if (accounts.length > 2) accounts.shift(); 
    localStorage.setItem('chatgo_accounts', JSON.stringify(accounts));
  }catch(err){toast('Gagal: '+err.message);} 
  b.disabled=false; b.textContent='Masuk'; 
});

$('#form-register').addEventListener('submit', async e => { e.preventDefault(); const b=$('#btn-register'); b.disabled=true; b.textContent='…'; try{await registerUser($('#reg-name').value,$('#reg-user').value,$('#reg-pass').value);}catch(err){toast('Gagal: '+err.message);} b.disabled=false; b.textContent='Buat Akun'; });

$('#fab').addEventListener('click', () => {
  showModal(`<div class="modal-header"><h3>Aksi Baru</h3></div><div class="menu-list">
    <button class="menu-item" id="mn-contact"><span class="ico">${SVG_CONTACT}</span>Kontak</button>
    <button class="menu-item" id="mnc"><span class="ico"><svg class="svg-icon-outline" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line></svg></span>Chat Baru</button>
    <button class="menu-item" id="mng"><span class="ico">${SVG_GROUP}</span>Buat Grup</button>
    <button class="menu-item" id="mns"><span class="ico">${SVG_GLOBE}</span>Buat Status</button>
  </div>`, r=>{
    r.querySelector('#mn-contact').onclick = () => { closeModal(); openContactsModal(); };
    r.querySelector('#mnc').onclick = () => { closeModal(); openNewChatModal(); };
    r.querySelector('#mng').onclick = () => { closeModal(); openNewGroupModal(); };
    r.querySelector('#mns').onclick = () => { closeModal(); openNewStatusModal(); };
  });
});

function openContactsModal() {
  const contacts = STATE.chats.filter(c => c.type === 'direct' && (!c.pendingFor || c.pendingFor.length === 0));
  
  let html = `<div class="modal-header"><h3>Kontak Saya</h3></div><div class="modal-body">`;
  if (contacts.length === 0) {
    html += `<p class="muted small center">Belum ada kontak. Mulai chat dengan orang lain terlebih dahulu.</p>`;
  } else {
    html += contacts.map(chat => {
      const otherUid = chat.members.find(u => u !== STATE.uid);
      const name = chat.memberNames?.[otherUid] || 'Pengguna';
      const photo = chat.memberPhotos?.[otherUid];
      const uname = chat.memberUsernames?.[otherUid] || '';
      return `<div class="search-result" data-contact="${chat.id}">
        ${avatarHTML(name, photo, 'sm')}
        <div class="info"><strong>${esc(name)}</strong><span>@${esc(uname)}</span></div>
        <button class="btn btn-soft sm" style="padding:6px 12px;font-size:12px">Chat</button>
      </div>`;
    }).join('');
  }
  html += `</div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>`;
  
  showModal(html, r => {
    r.querySelectorAll('[data-contact]').forEach(el => {
      el.onclick = () => { closeModal(); openChat(el.dataset.contact); };
    });
  });
}

function openNewChatModal() {
  showModal(`<div class="modal-header"><h3>Chat Baru</h3></div><div class="modal-body"><input id="sc-u" class="input-wrap" style="padding:10px;width:100%" placeholder="Cari username…"><div id="sc-r" style="margin-top:10px"></div></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Tutup</button></div>`, r=>{
    const inp = r.querySelector('#sc-u'); const res = r.querySelector('#sc-r');
    let t; inp.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(async()=>{
      if(inp.value.length<2){res.innerHTML='';return;}
      const s = await getDocs(query(collection(db,'users'),where('username','>=',inp.value.toLowerCase()),where('username','<=',inp.value.toLowerCase()+'\uf8ff'),limit(10)));
      res.innerHTML = s.docs.map(d=>{const u=d.data(); if(u.uid===STATE.uid)return ''; return `<div class="search-result" data-uid="${d.id}">${avatarHTML(u.displayName,u.photoURL,'sm')}<div class="info"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username)}</span></div></div>`}).join('');
      res.querySelectorAll('.search-result').forEach(el=>{el.onclick=()=>startChatWith(el.dataset.uid);});
    },300); });
  });
}

async function startChatWith(uid) {
  closeModal();
  const s = await getDocs(query(collection(db,'chats'),where('members','array-contains',STATE.uid)));
  for(const d of s.docs){ if(d.data().type==='direct' && (d.data().members||[]).includes(uid)){ openChat(d.id); return; } }
  const t = (await getDoc(doc(db,'users',uid))).data();
  const docRef = await addDoc(collection(db,'chats'),{
    type:'direct',members:[STATE.uid,uid],memberNames:{[STATE.uid]:STATE.me.displayName,[uid]:t.displayName},memberPhotos:{[STATE.uid]:STATE.me.photoURL||'',[uid]:t.photoURL||''},memberUsernames:{[STATE.uid]:STATE.me.username,[uid]:t.username},memberVerified:{[STATE.uid]:STATE.me.isVerified||false,[uid]:t.isVerified||false},pendingFor:t.privacy?.whoCanMessage==='contacts'?[uid]:[],unread:{},lastMessage:null,updatedAt:serverTimestamp(),createdAt:serverTimestamp()
  });
  openChat(docRef.id);
}

function openNewGroupModal() {
  showModal(`<div class="modal-header"><h3>Buat Grup</h3></div><div class="modal-body"><input id="g-n" class="input-wrap" style="padding:10px;width:100%;margin-bottom:10px" placeholder="Nama Grup"><input id="g-s" class="input-wrap" style="padding:10px;width:100%" placeholder="Cari anggota…"><div id="g-r"></div><div id="g-sel" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px"></div></div><div class="modal-footer"><button class="btn btn-soft" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="g-c">Buat</button></div>`, r=>{
    const sel = new Map(); const inp = r.querySelector('#g-s'); const res = r.querySelector('#g-r');
    let t; inp.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(async()=>{
      if(inp.value.length<2){res.innerHTML='';return;}
      const s = await getDocs(query(collection(db,'users'),where('username','>=',inp.value.toLowerCase()),where('username','<=',inp.value.toLowerCase()+'\uf8ff'),limit(5)));
      res.innerHTML = s.docs.map(d=>{const u=d.data(); if(d.id===STATE.uid)return ''; return `<div class="search-result" data-uid="${d.id}" data-n="${esc(u.displayName)}" data-p="${esc(u.photoURL||'')}" data-un="${esc(u.username)}">${avatarHTML(u.displayName,u.photoURL,'sm')}<div class="info"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username)}</span></div></div>`}).join('');
      res.querySelectorAll('.search-result').forEach(el=>{el.onclick=()=>{
        sel.set(el.dataset.uid, {name:el.dataset.n, photo:el.dataset.p, uname:el.dataset.un});
        const c = document.createElement('span'); c.className='alias-chip'; c.textContent=el.dataset.n+' ×'; c.onclick=()=>{sel.delete(el.dataset.uid);c.remove();}; r.querySelector('#g-sel').appendChild(c);
        inp.value=''; res.innerHTML='';
      }});
    },300); });
    r.querySelector('#g-c').onclick = async () => {
      const name = r.querySelector('#g-n').value.trim(); if(!name||sel.size<1) return toast('Isi nama & anggota');
      const members = [STATE.uid, ...sel.keys()];
      const mn = {[STATE.uid]:STATE.me.displayName}; const mp = {[STATE.uid]:STATE.me.photoURL||''}; const mu = {[STATE.uid]:STATE.me.username};
      sel.forEach((v,k)=>{mn[k]=v.name;mp[k]=v.photo;mu[k]=v.uname;});
      const ref = await addDoc(collection(db,'chats'),{type:'group',name,members,memberNames:mn,memberPhotos:mp,memberUsernames:mu,createdBy:STATE.uid,admins:[],onlyAdminsCanChat:false,whoCanAddMembers:'everyone',pendingFor:[],unread:{},lastMessage:null,updatedAt:serverTimestamp(),createdAt:serverTimestamp()});
      toast('Grup dibuat'); closeModal(); openChat(ref.id);
    };
  });
}

const _oldUpdateUI = updateProfileUI;
updateProfileUI = function() {
  _oldUpdateUI();
  if (STATE.me) {
    let accounts = JSON.parse(localStorage.getItem('chatgo_accounts') || '[]');
    let found = false;
    accounts.forEach(a => {
      if (a.username === STATE.me.username) { a.displayName = STATE.me.displayName; a.photoURL = STATE.me.photoURL; found = true; }
    });
    if (!found) {
       accounts.push({ username: STATE.me.username, password: '', displayName: STATE.me.displayName, photoURL: STATE.me.photoURL });
       if(accounts.length>2) accounts.shift();
    }
    localStorage.setItem('chatgo_accounts', JSON.stringify(accounts));
  }
}

showScreen('screen-auth');
